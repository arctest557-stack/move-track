function statusColor(st){const known=SCOL[st];if(known)return known;const i=DEFAULT_STATUSES.length;return{color:STATUS_PAL[i%STATUS_PAL.length],bg:"rgba(201,168,76,0.12)"};};

const pad = n => String(n).padStart(2,"0");
// Local time follows the AO (country) chosen by the admin. No AO yet = "TBC LOCATION": clock shows 00:00:00, logic runs on UTC.
const AO = {tz:"UTC", set:false};
const aoParts = d => {
  try{
    const fmt = new Intl.DateTimeFormat("en-GB",{timeZone:AO.tz,hourCycle:"h23",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",second:"numeric"});
    const o = {}; fmt.formatToParts(d||new Date()).forEach(p=>{ o[p.type]=parseInt(p.value,10); });
    return {y:o.year,mo:o.month,d:o.day,h:o.hour%24,mi:o.minute,s:o.second};
  }catch(e){
    const n=d||new Date();
    return {y:n.getUTCFullYear(),mo:n.getUTCMonth()+1,d:n.getUTCDate(),h:n.getUTCHours(),mi:n.getUTCMinutes(),s:n.getUTCSeconds()};
  }
};
const aoFakeNow = () => { const p=aoParts(); return new Date(Date.UTC(p.y,p.mo-1,p.d,p.h,p.mi,p.s)); };
const bhrNow = () => { if(!AO.set) return "00:00:00"; const p=aoParts(); return pad(p.h)+":"+pad(p.mi)+":"+pad(p.s); };
const zuluNow = () => { const n=new Date(); return pad(n.getUTCHours())+":"+pad(n.getUTCMinutes())+":"+pad(n.getUTCSeconds()); };
const nowMins = () => { const p=aoParts(); return p.h*60+p.mi; };
const toMins = t => { if(!t||!t.includes(":"))return null; const[h,m]=t.split(":").map(Number); return h*60+m; };
const isOvd = r => {
  if(!r||!r.dueBack||r.status==="IN"||!r.status)return false;
  if(r.dueDate){
    const now=aoFakeNow();
    const[d,mo]=r.dueDate.split("/").map(Number);
    const due=new Date(Date.UTC(now.getUTCFullYear(),mo-1,d));
    const today=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()));
    if(due>today)return false;
    if(due<today)return true;
  }
  const m=toMins(r.dueBack); return m!==null&&nowMins()>m;
};
const ovdStr = r => { const d=nowMins()-toMins(r.dueBack),h=Math.floor(d/60),m=d%60; return h>0?"+"+h+"H "+m+"M":"+"+m+"M"; };

const {useState,useEffect,useRef} = React;

// TIME PICKER
function TimePicker({time,date,onConfirm,onClear,onClose}){
  const [h,setH] = useState(parseInt((time||"00:00").split(":")[0])||0);
  const [m,setM] = useState(parseInt((time||"00:00").split(":")[1])||0);
  const now = aoFakeNow();
  const [day,setDay] = useState(date?parseInt(date.split("/")[0]):now.getUTCDate());
  const [mon,setMon] = useState(date?parseInt(date.split("/")[1])-1:now.getUTCMonth());
  const daysInMonth = new Date(Date.UTC(now.getUTCFullYear(),mon+1,0)).getUTCDate();
  const fnt = "'Share Tech Mono',monospace";
  const btnS = (sel) => ({background:sel?"rgba(201,168,76,0.2)":"#080a0d",border:"1px solid "+(sel?"#c9a84c":"#1e2630"),color:sel?"#c9a84c":"#5a6a7a",fontFamily:fnt,fontSize:"12px",padding:"6px 8px",cursor:"pointer",minWidth:"40px",letterSpacing:"1px"});
  const lbl = {fontSize:"9px",color:"#5a6a7a",letterSpacing:"3px",marginBottom:"8px",fontFamily:fnt};
  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:"16px",overflowY:"auto"}}>
      <div style={{background:"#0f1318",border:"1px solid #c9a84c",width:"100%",maxWidth:"380px",fontFamily:fnt}}>
        <div style={{background:"#0d1117",borderBottom:"1px solid #7a6330",padding:"12px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{color:"#c9a84c",fontSize:"11px",letterSpacing:"3px"}}>DUE BACK — DATE & TIME (LOCAL)</span>
          <button onClick={onClose} style={{background:"transparent",border:"none",color:"#5a6a7a",cursor:"pointer",fontSize:"18px"}}>✕</button>
        </div>
        <div style={{padding:"16px 20px"}}>
          <div style={{textAlign:"center",fontSize:"32px",fontFamily:"'Barlow Condensed',sans-serif",fontWeight:"900",color:"#c9a84c",letterSpacing:"4px",marginBottom:"16px"}}>
            {pad(day)} {MONTHS[mon]} — {pad(h)}:{pad(m)}
          </div>
          <div style={{marginBottom:"12px"}}><div style={lbl}>MONTH</div><div style={{display:"flex",flexWrap:"wrap",gap:"5px"}}>{MONTHS.map((mo,i)=><button key={i} onClick={()=>{setMon(i);const dim=new Date(Date.UTC(now.getUTCFullYear(),i+1,0)).getUTCDate();if(day>dim)setDay(dim);}} style={btnS(mon===i)}>{mo}</button>)}</div></div>
          <div style={{marginBottom:"12px"}}><div style={lbl}>DAY</div><div style={{display:"flex",flexWrap:"wrap",gap:"5px"}}>{Array.from({length:daysInMonth},(_,i)=>i+1).map(d=><button key={d} onClick={()=>setDay(d)} style={btnS(day===d)}>{pad(d)}</button>)}</div></div>
          <div style={{marginBottom:"12px"}}><div style={lbl}>HOUR</div><div style={{display:"flex",flexWrap:"wrap",gap:"5px"}}>{Array.from({length:24},(_,i)=>i).map(hh=><button key={hh} onClick={()=>setH(hh)} style={btnS(h===hh)}>{pad(hh)}</button>)}</div></div>
          <div style={{marginBottom:"20px"}}><div style={lbl}>MINUTE</div><div style={{display:"flex",flexWrap:"wrap",gap:"5px"}}>{[0,5,10,15,20,25,30,35,40,45,50,55].map(mm=><button key={mm} onClick={()=>setM(mm)} style={btnS(m===mm)}>{pad(mm)}</button>)}</div></div>
          <div style={{display:"flex",gap:"8px"}}>
            <button onClick={onClear} style={{flex:1,background:"rgba(231,76,60,0.1)",border:"1px solid rgba(231,76,60,0.4)",color:"#e74c3c",fontFamily:fnt,fontSize:"12px",letterSpacing:"2px",padding:"10px",cursor:"pointer"}}>CLEAR</button>
            <button onClick={()=>onConfirm(pad(h)+":"+pad(m),pad(day)+"/"+pad(mon+1))} style={{flex:2,background:"rgba(201,168,76,0.15)",border:"1px solid #c9a84c",color:"#c9a84c",fontFamily:fnt,fontSize:"12px",letterSpacing:"2px",padding:"10px",cursor:"pointer"}}>CONFIRM</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// Vehicle Date Picker
function VehicleDatePicker({value, onConfirm, onClose}){
  const MONTHS=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  const today=new Date();
  const initParts=(value||"").split("/");
  const [day,setDay]=React.useState(parseInt(initParts[0])||today.getDate());
  const [mon,setMon]=React.useState(parseInt(initParts[1])-1>=0?parseInt(initParts[1])-1:today.getMonth());
  const [yr,setYr]=React.useState(parseInt(initParts[2])||today.getFullYear());
  const daysInMonth=new Date(yr,mon+1,0).getDate();
  const fnt="'Share Tech Mono',monospace";
  const btnS=(sel)=>({background:sel?"rgba(201,168,76,0.2)":"#080a0d",border:"1px solid "+(sel?"#c9a84c":"#1e2630"),color:sel?"#c9a84c":"#5a6a7a",fontFamily:fnt,fontSize:"11px",padding:"5px 7px",cursor:"pointer",minWidth:"36px"});
  const lbl={fontSize:"9px",color:"#5a6a7a",letterSpacing:"3px",marginBottom:"8px",fontFamily:fnt};
  const pad=n=>String(n).padStart(2,"0");
  const years=Array.from({length:5},(_,i)=>today.getFullYear()-2+i);
  return(
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:"16px",overflowY:"auto"}}>
      <div style={{background:"#0f1318",border:"1px solid #c9a84c",width:"100%",maxWidth:"380px",fontFamily:fnt}}>

          <span style={{color:"#c9a84c",fontSize:"11px",letterSpacing:"3px"}}>DATE TAKEN ON</span>
          <button onClick={onClose} style={{background:"transparent",border:"none",color:"#5a6a7a",cursor:"pointer",fontSize:"18px"}}>✕</button>
        </div>
        <div style={{padding:"16px 20px"}}>
          <div style={{textAlign:"center",fontSize:"28px",fontFamily:"'Barlow Condensed',sans-serif",fontWeight:"900",color:"#c9a84c",letterSpacing:"4px",marginBottom:"16px"}}>
            {pad(day)} {MONTHS[mon]} {yr}
          </div>
          <div style={{marginBottom:"12px"}}><div style={lbl}>YEAR</div><div style={{display:"flex",gap:"5px",flexWrap:"wrap"}}>{years.map(y=><button key={y} onClick={()=>setYr(y)} style={btnS(yr===y)}>{y}</button>)}</div></div>
          <div style={{marginBottom:"12px"}}><div style={lbl}>MONTH</div><div style={{display:"flex",gap:"5px",flexWrap:"wrap"}}>{MONTHS.map((m,i)=><button key={i} onClick={()=>{setMon(i);const dim=new Date(yr,i+1,0).getDate();if(day>dim)setDay(dim);}} style={btnS(mon===i)}>{m}</button>)}</div></div>
          <div style={{marginBottom:"20px"}}><div style={lbl}>DAY</div><div style={{display:"flex",gap:"5px",flexWrap:"wrap"}}>{Array.from({length:daysInMonth},(_,i)=>i+1).map(d=><button key={d} onClick={()=>setDay(d)} style={btnS(day===d)}>{pad(d)}</button>)}</div></div>
          <div style={{display:"flex",gap:"8px"}}>
            <button onClick={()=>onConfirm("")} style={{flex:1,background:"rgba(231,76,60,0.1)",border:"1px solid rgba(231,76,60,0.4)",color:"#e74c3c",fontFamily:fnt,fontSize:"12px",letterSpacing:"2px",padding:"10px",cursor:"pointer"}}>CLEAR</button>
            <button onClick={()=>onConfirm(pad(day)+"/"+pad(mon+1)+"/"+yr)} style={{flex:2,background:"rgba(201,168,76,0.15)",border:"1px solid #c9a84c",color:"#c9a84c",fontFamily:fnt,fontSize:"12px",letterSpacing:"2px",padding:"10px",cursor:"pointer"}}>CONFIRM</button>
          </div>
        </div>
      </div>
    </div>
  );
}

const genPw = () => {
  const cs = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  const a = new Uint32Array(14); crypto.getRandomValues(a);
  return Array.from(a).map(n=>cs[n%cs.length]).join("");
};
const csvCell = v => {
  let s = String(v==null?"":v);
  if(/^[=+\-@\t\r]/.test(s)) s = "'"+s;          // block spreadsheet formula injection
  return '"'+s.replace(/"/g,'""')+'"';
};
const downloadText = (name,text,mime) => {
  const b = new Blob([text],{type:mime||"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
};
const keyOf = n => String(n).replace(/[^a-zA-Z0-9]/g,"_").slice(0,48);
const rankObj = code => RANKS.find(r=>r.code===code) || RANKS[RANKS.length-1];
const RANK_GROUPS = ["Army","Royal Navy","RAF","Other"];
function RankOptions(){
  return RANK_GROUPS.map(g=>{ const l=RANKS.filter(r=>(r.grp||"Other")===g).sort((a,b)=>b.order-a.order); return l.length?<optgroup key={g} label={g}>{l.map(r=><option key={r.code} value={r.code}>{r.code} — {r.name}</option>)}</optgroup>:null; });
}
const iso3Of = ao => { if(!ao||!ao.country) return ""; if(ao.iso3) return ao.iso3; const c=((window.MT_GEO||{}).countries||[]).find(x=>x[0]===ao.country); return c&&c[6]||""; };
const _bcache = {};
const fetchBoundaries = (iso3,level) => {
  const key=iso3+level; if(_bcache[key]) return Promise.resolve(_bcache[key]);
  const url="https://media.githubusercontent.com/media/wmgeolab/geoBoundaries/main/releaseData/gbOpen/"+iso3+"/"+level+"/geoBoundaries-"+iso3+"-"+level+"_simplified.geojson";
  return fetch(url).then(r=>{ if(!r.ok) throw new Error("no data"); return r.json(); }).then(j=>{ if(!j||!j.features||!j.features.length) throw new Error("empty"); _bcache[key]=j; return j; });
};

function AccountModal({user,profile,onClose}){
  const [cur,setCur] = useState("");
  const [n1,setN1] = useState("");
  const [n2,setN2] = useState("");
  const [msg,setMsg] = useState(null);
  const [busy,setBusy] = useState(false);
  const save = async () => {
    setMsg(null);
    if(!cur) return setMsg({ok:false,t:"ENTER YOUR CURRENT PASSWORD"});
    if(n1.length<10) return setMsg({ok:false,t:"NEW PASSWORD MUST BE AT LEAST 10 CHARACTERS"});
    if(n1!==n2) return setMsg({ok:false,t:"NEW PASSWORDS DO NOT MATCH"});
    setBusy(true);
    try{
      const cred = firebase.auth.EmailAuthProvider.credential(user.email, cur);
      await user.reauthenticateWithCredential(cred);
      await user.updatePassword(n1);
      auditNow("ACCOUNT",profile.username,"password","","changed by user");
      setMsg({ok:true,t:"PASSWORD CHANGED"}); setCur(""); setN1(""); setN2("");
    }catch(e){
      const c=(e&&e.code)||"";
      setMsg({ok:false,t:(c==="auth/invalid-credential"||c==="auth/wrong-password")?"CURRENT PASSWORD IS INCORRECT":(c==="auth/weak-password"?"PASSWORD TOO WEAK":"COULD NOT CHANGE PASSWORD"+(c?" ("+c+")":""))});
    }
    setBusy(false);
  };
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px",zIndex:10000}} onClick={onClose}>
      <div style={{width:"100%",maxWidth:"360px",background:A.panel,border:"1px solid "+A.line,borderTop:"3px solid "+A.gold,padding:"24px"}} onClick={e=>e.stopPropagation()}>
        <div style={{fontFamily:A.sans,fontWeight:900,fontSize:"22px",letterSpacing:"3px",color:"#fff"}}>CHANGE PASSWORD</div>
        <div style={{fontFamily:A.mono,fontSize:"10px",color:A.dim,letterSpacing:"2px",marginTop:"4px"}}>USER: {profile.username.toUpperCase()}</div>
        <div style={labSt}>CURRENT PASSWORD</div>
        <input style={inputSt} type="password" value={cur} onChange={e=>setCur(e.target.value)} autoComplete="current-password"/>
        <div style={labSt}>NEW PASSWORD (MIN 10 CHARS)</div>
        <input style={inputSt} type="password" value={n1} onChange={e=>setN1(e.target.value)} autoComplete="new-password"/>
        <div style={labSt}>CONFIRM NEW PASSWORD</div>
        <input style={inputSt} type="password" value={n2} onChange={e=>setN2(e.target.value)} autoComplete="new-password"/>
        {msg&&<div style={{marginTop:"12px",fontFamily:A.mono,fontSize:"11px",letterSpacing:"1px",color:msg.ok?A.green:A.red}}>{msg.ok?"✔ ":"⚠ "}{msg.t}</div>}

          <button onClick={save} disabled={busy} style={{...btnSt(),flex:1,opacity:busy?0.5:1}}>{busy?"SAVING...":"SAVE"}</button>
          <button onClick={onClose} style={{...btnSt(A.dim),flex:1}}>CLOSE</button>
        </div>
      </div>
    </div>
  );
}

// Creates a Firebase Auth login WITHOUT signing the admin out (uses a throw-away second app instance).
async function createAuthUser(username,password){
  let sec;
  try{ sec = firebase.app("creator"); }catch(e){ sec = firebase.initializeApp(CFG.firebase,"creator"); }
  const sa = sec.auth();
  await sa.setPersistence(firebase.auth.Auth.Persistence.NONE);
  const cred = await sa.createUserWithEmailAndPassword(toEmail(username),password);
  const uid = cred.user.uid;
  await sa.signOut();
  return uid;
}
const createErr = e => {
  const c=(e&&e.code)||"";
  if(c==="auth/email-already-in-use") return "THAT USERNAME IS ALREADY TAKEN (usernames cannot be reused — pick another)";
  if(c==="auth/operation-not-allowed") return "EMAIL/PASSWORD SIGN-IN IS NOT ENABLED IN FIREBASE";
  if(c==="auth/weak-password") return "PASSWORD TOO WEAK";
  if(c==="PERMISSION_DENIED"||/permission/i.test((e&&e.message)||"")) return "DATABASE REFUSED THE WRITE — CHECK THE RULES WERE PUBLISHED";
  return "COULD NOT CREATE USER"+(c?" ("+c+")":"");
};

// ───────── AREA OF OPERATIONS (country → clock, map, region list) ─────────
function AoPanel({ao,evacOpen}){
  const G = window.MT_GEO || {countries:[],regions:{}};
  const [cc,setCc] = useState(ao.country||"");
  const [tz,setTz] = useState(ao.tz||"");
  const [msg,setMsg] = useState(null);
  useEffect(()=>{ setCc(ao.country||""); setTz(ao.tz||""); },[ao.country,ao.tz]);
  const cobj = G.countries.find(c=>c[0]===cc);
  const tzs = cobj ? cobj[5] : [];
  const regs = (G.regions[cc]||[]);
  const pickCountry = v => { setCc(v); const c=G.countries.find(x=>x[0]===v); setTz(c&&c[5][0]||""); setMsg(null); };
  const validTz = z => { try{ new Intl.DateTimeFormat("en-GB",{timeZone:z}); return true; }catch(e){ return false; } };
  const populate = () => {
    if(!cobj) return;
    const o = {}; o[keyOf(cobj[1].toUpperCase())] = cobj[1].toUpperCase();
    regs.forEach(r=>{ const n=r[0].toUpperCase().slice(0,40); o[keyOf(n)]=n; });
    return db.ref("locations2").set(o).then(()=>{ auditNow("AO","LOCATION LIST","populate","",Object.keys(o).length+" regions of "+cobj[1]); });
  };
  const apply = async () => {
    setMsg(null);
    if(!cobj) return setMsg({ok:false,t:"SELECT A COUNTRY"});
    if(!tz||!validTz(tz)) return setMsg({ok:false,t:"NO VALID TIME ZONE FOR THAT COUNTRY"});
    try{
      await db.ref("settings/ao").set({country:cc,iso3:cobj[6]||"",name:cobj[1],tz:tz,lat:cobj[2],lng:cobj[3],zoom:cobj[4]});
      auditNow("AO","AREA OF OPERATIONS","country",ao.name||"TBC",cobj[1]);
      let t = "AO SET TO "+cobj[1].toUpperCase();
      if(window.confirm("Replace the LOCATION list with "+cobj[1]+" and its "+regs.length+" regions?\n\n(Press Cancel to keep the existing list. You can do this later with the POPULATE button.)")){
        await populate(); t += " — LOCATION LIST POPULATED";
      }
      setMsg({ok:true,t:t});
    }catch(e){ setMsg({ok:false,t:"COULD NOT SAVE: "+((e&&e.message)||"error")}); }
  };
  const clearAo = async () => {
    if(!window.confirm("Reset the AO to 'TBC LOCATION' (clock back to 00:00:00)?")) return;
    await db.ref("settings/ao").remove();
    auditNow("AO","AREA OF OPERATIONS","country",ao.name||"",""); setMsg({ok:true,t:"AO RESET TO TBC"});
  };
  const setEvac = v => { db.ref("settings/evacOpen").set(v); auditNow("AO","EVAC EDITING","everyone",String(evacOpen),String(v)); };
  return (
    <div style={panelSt}>
      <div style={{fontSize:"11px",color:A.dim,letterSpacing:"1px",marginBottom:"10px"}}>
        CURRENT: <span style={{color:ao.country?A.gold:A.orange}}>{ao.name?ao.name.toUpperCase()+" ("+ao.tz+")":"TBC LOCATION — clock shows 00:00:00"}</span>
      </div>
      <div style={{...labSt,marginTop:0}}>COUNTRY</div>
      <select value={cc} onChange={e=>pickCountry(e.target.value)} style={{...inputSt,maxWidth:"420px"}}>
        <option value="">— SELECT COUNTRY —</option>
        {G.countries.map(c=><option key={c[0]} value={c[0]}>{c[1]}</option>)}
      </select>
      {tzs.length>1&&<>
        <div style={labSt}>TIME ZONE (THIS COUNTRY HAS SEVERAL)</div>
        <select value={tz} onChange={e=>setTz(e.target.value)} style={{...inputSt,maxWidth:"420px"}}>{tzs.map(z=><option key={z} value={z}>{z}</option>)}</select>
      </>}
      {cobj&&<div style={{fontSize:"10px",color:A.dim,letterSpacing:"1px",marginTop:"8px"}}>{regs.length} built-in regions available for this country. More places can be added from the AO Map tab (free OpenStreetMap search).</div>}
      {msg&&<div style={{marginTop:"12px",fontSize:"11px",letterSpacing:"1px",color:msg.ok?A.green:A.red}}>{msg.ok?"✔ ":"⚠ "}{msg.t}</div>}
      <div style={{marginTop:"14px",display:"flex",flexWrap:"wrap",gap:"8px"}}>
        <button style={btnSt()} onClick={apply}>APPLY COUNTRY</button>
        <button style={btnSt(A.blue)} disabled={!cobj} onClick={()=>{ if(window.confirm("Replace the LOCATION list with the regions of "+(cobj&&cobj[1])+"?")) populate().then(()=>setMsg({ok:true,t:"LOCATION LIST POPULATED"})); }}>POPULATE LOCATION LIST FROM REGIONS</button>
        <button style={btnSt(A.dim)} onClick={clearAo}>RESET TO TBC</button>
      </div>
      <div style={{...labSt,marginTop:"20px"}}>EVAC PAX LIST EDITING</div>
      <label style={{display:"flex",alignItems:"center",gap:"8px",fontSize:"11px",letterSpacing:"1px",color:"#d4dde8",cursor:"pointer"}}>
        <input type="checkbox" checked={evacOpen} onChange={e=>setEvac(e.target.checked)}/> Everyone can edit the EVAC list (untick: only admins and people with the EVAC function)
      </label>
    </div>
  );
}

// ───────── CREATE USER ─────────
function CreateUser({me,onCreated}){
  const [nu,setNu] = useState("");
  const [np,setNp] = useState("");
  const [nm,setNm] = useState("");
  const [rk,setRk] = useState("");
  const [role,setRole] = useState("user");
  const [onBoard,setOnBoard] = useState(true);
  const [perms,setPerms] = useState({});
  const [idle,setIdle] = useState(DEFAULT_IDLE);
  const [msg,setMsg] = useState(null);
  const [busy,setBusy] = useState(false);
  const [made,setMade] = useState(null);
  const create = async () => {
    setMsg(null);
    const uname = nu.trim().toLowerCase();
    const name = nm.trim().toUpperCase().slice(0,25);
    if(!USER_RE.test(uname)) return setMsg({ok:false,t:"USERNAME: 3-30 CHARACTERS — a-z 0-9 . _ - ONLY"});
    if(np.length<10) return setMsg({ok:false,t:"PASSWORD MUST BE AT LEAST 10 CHARACTERS"});
    if(!name) return setMsg({ok:false,t:"ENTER THE PERSON'S DISPLAY NAME (shown on the board)"});
    if(!rk) return setMsg({ok:false,t:"SELECT A RANK"});
    const idleN = parseInt(idle,10);
    if(!(idleN>=0&&idleN<=1440)) return setMsg({ok:false,t:"IDLE TIMEOUT MUST BE 0-1440 MINUTES (0 = NEVER)"});
    setBusy(true);
    try{
      const uid = await createAuthUser(uname,np);
      const r = rankObj(rk);
      const pm = {}; PERM_DEFS.forEach(([k])=>{ pm[k]=!!perms[k]; });
      const ups = {};
      ups["users/"+uid] = {username:uname,role:role,disabled:false,name:name,rank:r.code,rankOrder:r.order,onBoard:onBoard,perms:pm,idleMin:idleN,createdAt:SV(),createdBy:me.uid};
      ups["roster/"+uid] = {name:name,rank:r.code,rankOrder:r.order,onBoard:onBoard};
      await db.ref().update(ups);
      auditNow("ADMIN","USER "+uname,"created","",role.toUpperCase()+" / "+r.code+" "+name);
      setMade({u:uname,p:np});
      setNu(""); setNp(""); setNm(""); setRk(""); setRole("user"); setPerms({}); setIdle(DEFAULT_IDLE); setOnBoard(true);
      setMsg({ok:true,t:"USER CREATED"});
      if(onCreated) onCreated();
    }catch(e){ setMsg({ok:false,t:createErr(e)}); }
    setBusy(false);
  };
  return (
    <div style={{...panelSt,maxWidth:"620px"}}>
      {made&&<div style={{marginBottom:"14px",padding:"12px",border:"1px solid "+A.green,background:A.green+"11",fontSize:"12px",letterSpacing:"1px",lineHeight:"1.8"}}>
        <div style={{color:A.green}}>✔ GIVE THESE DETAILS TO THE USER — THE PASSWORD IS NOT SHOWN AGAIN</div>
        USERNAME: <b style={{color:"#fff"}}>{made.u}</b><br/>PASSWORD: <b style={{color:"#fff"}}>{made.p}</b>
        <div style={{marginTop:"8px"}}>
          <button style={smallBtn(A.gold)} onClick={()=>{ try{navigator.clipboard.writeText("Username: "+made.u+"\nPassword: "+made.p);}catch(e){} }}>COPY</button>
          <button style={smallBtn(A.dim)} onClick={()=>setMade(null)}>DISMISS</button>
        </div>
      </div>}
      <div style={{...labSt,marginTop:0}}>USERNAME (LOGIN)</div>
      <input style={inputSt} value={nu} onChange={e=>setNu(e.target.value)} autoComplete="off" autoCapitalize="none" spellCheck={false} placeholder="e.g. j.smith"/>
      <div style={labSt}>PASSWORD (MIN 10 CHARS — YOU SET IT, THE USER CAN CHANGE IT LATER)</div>
      <div style={{display:"flex",gap:"8px"}}>
        <input style={inputSt} value={np} onChange={e=>setNp(e.target.value)} autoComplete="off" spellCheck={false}/>
        <button onClick={()=>setNp(genPw())} style={{...btnSt(A.dim),whiteSpace:"nowrap"}}>GENERATE</button>
      </div>
      <div style={{display:"flex",gap:"12px",flexWrap:"wrap"}}>
        <div style={{flex:"1 1 200px"}}><div style={labSt}>DISPLAY NAME (ON BOARD)</div><input style={inputSt} value={nm} onChange={e=>setNm(e.target.value)} maxLength={25} placeholder="e.g. SMITH"/></div>
        <div style={{flex:"1 1 200px"}}><div style={labSt}>RANK</div>
          <select style={inputSt} value={rk} onChange={e=>setRk(e.target.value)}><option value="">— SELECT RANK —</option><RankOptions/></select></div>
      </div>
      <div style={{display:"flex",gap:"12px",flexWrap:"wrap"}}>
        <div style={{flex:"1 1 200px"}}><div style={labSt}>ACCESS LEVEL</div>
          <select style={inputSt} value={role} onChange={e=>{setRole(e.target.value); setOnBoard(e.target.value!=="admin");}}>
            <option value="user">USER — cannot see the Admin tab</option>
            <option value="admin">ADMIN — full access incl. Admin tab</option>
          </select></div>
        <div style={{flex:"1 1 200px"}}><div style={labSt}>IDLE LOGOUT (MINUTES, 0 = NEVER)</div><input style={inputSt} type="number" min="0" max="1440" value={idle} onChange={e=>setIdle(e.target.value)}/></div>
      </div>
      <div style={labSt}>FUNCTIONS (TICK ANY)</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:"6px 18px"}}>
        {PERM_DEFS.map(([k,l])=>(
          <label key={k} style={{display:"flex",alignItems:"center",gap:"6px",fontSize:"11px",letterSpacing:"1px",color:"#d4dde8",cursor:"pointer"}}>
            <input type="checkbox" checked={!!perms[k]} onChange={e=>setPerms(p=>({...p,[k]:e.target.checked}))}/> {l}
          </label>
        ))}
      </div>
      <label style={{display:"flex",alignItems:"center",gap:"6px",marginTop:"12px",fontSize:"11px",letterSpacing:"1px",color:"#d4dde8",cursor:"pointer"}}>
        <input type="checkbox" checked={onBoard} onChange={e=>setOnBoard(e.target.checked)}/> SHOW THIS PERSON ON THE BOARD
      </label>
      {msg&&<div style={{marginTop:"12px",fontSize:"11px",letterSpacing:"1px",color:msg.ok?A.green:A.red}}>{msg.ok?"✔ ":"⚠ "}{msg.t}</div>}
      <button onClick={create} disabled={busy} style={{...btnSt(),marginTop:"16px",opacity:busy?0.5:1}}>{busy?"CREATING...":"CREATE USER"}</button>
    </div>
  );
}

// ───────── ONE USER CARD (edit rank / functions / timeout, disable, reset login) ─────────
function UserCard({uid,u,pres,online,self,me,activeAdmins,onIssued}){
  const sig = JSON.stringify([u.name,u.rank,u.onBoard,u.perms,u.idleMin]);
  const [name,setName] = useState(u.name||"");
  const [rank,setRank] = useState(u.rank||"");
  const [onBoard,setOnBoard] = useState(u.onBoard!==false);
  const [perms,setPerms] = useState(u.perms||{});

  const [busy,setBusy] = useState(false);

  const dirty = name!==(u.name||"") || rank!==(u.rank||"") || onBoard!==(u.onBoard!==false) || JSON.stringify(PERM_DEFS.map(([k])=>!!perms[k]))!==JSON.stringify(PERM_DEFS.map(([k])=>!!(u.perms||{})[k])) || String(idle)!==String(u.idleMin==null?DEFAULT_IDLE:u.idleMin);
  const save = async () => {
    setMsg(null);
    const nm = name.trim().toUpperCase().slice(0,25);
    const idleN = parseInt(idle,10);
    if(!nm) return setMsg({ok:false,t:"NAME CANNOT BE EMPTY"});

    const r = rankObj(rank), pm = {}; PERM_DEFS.forEach(([k])=>{ pm[k]=!!perms[k]; });
    const ups = {};
    ups["users/"+uid+"/name"]=nm; ups["users/"+uid+"/rank"]=r.code; ups["users/"+uid+"/rankOrder"]=r.order;
    ups["users/"+uid+"/onBoard"]=onBoard; ups["users/"+uid+"/perms"]=pm; ups["users/"+uid+"/idleMin"]=idleN;
    ups["roster/"+uid]={name:nm,rank:r.code,rankOrder:r.order,onBoard:onBoard};
    try{
      await db.ref().update(ups);
      const was = [u.rank,u.name,JSON.stringify(u.perms||{}),u.idleMin,u.onBoard].join(" | ");
      auditNow("ADMIN","USER "+u.username,"edited",was,[r.code,nm,JSON.stringify(pm),idleN,onBoard].join(" | "));
      setMsg({ok:true,t:"SAVED"});
    }catch(e){ setMsg({ok:false,t:"SAVE FAILED"}); }
  };
  const toggleDisabled = () => {
    if(!u.disabled && u.role==="admin" && activeAdmins<=1) return window.alert("You cannot disable the only active admin. Create a second admin first.");
    if(!window.confirm((u.disabled?"Re-enable ":"Disable ")+u.username+"?")) return;
    db.ref("users/"+uid+"/disabled").set(!u.disabled);
    auditNow("ADMIN","USER "+u.username,"disabled",String(!!u.disabled),String(!u.disabled));
  };
  const toggleRole = () => {
    const to = u.role==="admin"?"user":"admin";
    if(to==="user" && activeAdmins<=1) return window.alert("You cannot demote the only admin. Create a second admin first.");
    if(!window.confirm("Change "+u.username+" to "+to.toUpperCase()+"?")) return;
    db.ref("users/"+uid+"/role").set(to);
    auditNow("ADMIN","USER "+u.username,"role",u.role,to);
  };
  const openReset = () => {
    const m = u.username.match(/^(.*?)(\d*)$/); const base = m[1]; const n = (parseInt(m[2],10)||1)+1;
    setRn((base+n).slice(0,30)); setRp(genPw()); setReset(true); setMade(null); setMsg(null);
  };
  const doReset = async () => {
    setMsg(null);
    const nn = rn.trim().toLowerCase();
    if(!USER_RE.test(nn)) return setMsg({ok:false,t:"USERNAME: 3-30 CHARACTERS — a-z 0-9 . _ - ONLY"});
    if(rp.length<10) return setMsg({ok:false,t:"PASSWORD MUST BE AT LEAST 10 CHARACTERS"});
    if(!window.confirm("Issue a NEW login ("+nn+") for "+u.name+" and permanently retire '"+u.username+"'? Their name, rank, functions and board line carry over.")) return;
    setBusy(true);
    try{
      const [rs,bs] = await Promise.all([db.ref("roster/"+uid).once("value"), db.ref("board/"+uid).once("value")]);
      const nuid = await createAuthUser(nn,rp);
      const ups = {};
      ups["users/"+nuid] = {...u, username:nn, disabled:false, createdAt:SV(), createdBy:me.uid, resetFrom:uid};
      ups["users/"+uid+"/disabled"] = true;
      ups["users/"+uid+"/replacedBy"] = nuid;
      ups["roster/"+nuid] = rs.val() || {name:u.name,rank:u.rank,rankOrder:u.rankOrder||0,onBoard:u.onBoard!==false};
      ups["roster/"+uid] = null;
      ups["board/"+nuid] = bs.val() || null;
      ups["board/"+uid] = null;
      await db.ref().update(ups);
      auditNow("ADMIN","USER "+u.username,"login reset","old login retired","new username "+nn);
      if(onIssued) onIssued({u:nn,p:rp,name:u.name}); setReset(false);
    }catch(e){ setMsg({ok:false,t:createErr(e)}); }
    setBusy(false);
  };
  const chip = (t,c) => <span style={{border:"1px solid "+c+"88",color:c,fontSize:"10px",letterSpacing:"1px",padding:"2px 7px",marginRight:"6px"}}>{t}</span>;
  return (
    <div style={{...panelSt,marginBottom:"10px",borderLeft:"3px solid "+(u.disabled?A.red:(online?A.green:A.line))}}>
      <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:"6px 12px",marginBottom:"10px"}}>
        <span style={{color:"#fff",fontSize:"14px",letterSpacing:"2px"}}>{u.username}{self&&<span style={{color:A.dim}}> (you)</span>}</span>
        {chip(u.role==="admin"?"ADMIN":"USER",u.role==="admin"?A.gold:A.dim)}
        {u.disabled?chip("DISABLED",A.red):chip("ACTIVE",A.green)}
        {online?chip("● ONLINE",A.green):chip("○ OFFLINE",A.dim)}
      </div>
      <div style={{fontSize:"10px",color:A.dim,letterSpacing:"1px",lineHeight:"1.8",marginBottom:"10px"}}>
        LAST LOGIN: <span style={{color:"#d4dde8"}}>{fmtZ(pres&&pres.lastLogin)}</span> &nbsp;·&nbsp; LAST LOGOUT: <span style={{color:"#d4dde8"}}>{fmtZ(pres&&pres.lastLogout)}</span> &nbsp;·&nbsp; LAST SEEN: <span style={{color:"#d4dde8"}}>{fmtZ(pres&&pres.lastSeen)}</span>
      </div>
      <div style={{display:"flex",gap:"10px",flexWrap:"wrap"}}>
        <div style={{flex:"1 1 160px"}}><div style={{...labSt,marginTop:0}}>DISPLAY NAME</div><input style={inputSt} value={name} maxLength={25} onChange={e=>setName(e.target.value)}/></div>
        <div style={{flex:"1 1 160px"}}><div style={{...labSt,marginTop:0}}>RANK</div>
          <select style={inputSt} value={rank} onChange={e=>setRank(e.target.value)}><RankOptions/></select></div>
        <div style={{flex:"0 1 130px"}}><div style={{...labSt,marginTop:0}}>IDLE LOGOUT (MIN)</div><input style={inputSt} type="number" min="0" max="1440" value={idle} onChange={e=>setIdle(e.target.value)}/></div>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:"6px 16px",marginTop:"12px"}}>
        {PERM_DEFS.map(([k,l])=>(

        <label style={{display:"flex",alignItems:"center",gap:"5px",fontSize:"10px",letterSpacing:"1px",color:"#d4dde8",cursor:"pointer"}}>

// ───────── ACTIVITY LOGS + MONTHLY WIPE ─────────
function LogManager({users}){
  const [view,setView] = useState("logins");
  const [logs,setLogs] = useState([]);
  const [chg,setChg] = useState([]);
  const [flt,setFlt] = useState("");
  const [oldest,setOldest] = useState(null);
  const [dl,setDl] = useState(false);
  const [busy,setBusy] = useState(false);
  const [msg,setMsg] = useState(null);
  useEffect(()=>{
    const r1=db.ref("logs").orderByKey().limitToLast(300), r2=db.ref("changes").orderByKey().limitToLast(300);
    const r3=db.ref("logs").orderByChild("ts").limitToFirst(1), r4=db.ref("changes").orderByChild("ts").limitToFirst(1);
    const arr = s => { const a=[]; s.forEach(ch=>{ a.push({id:ch.key,...ch.val()}); }); return a.reverse(); };
    let o1=null,o2=null;
    const setO = () => setOldest(Math.min(o1==null?Infinity:o1, o2==null?Infinity:o2)===Infinity?null:Math.min(o1==null?Infinity:o1, o2==null?Infinity:o2));
    const c1=s=>setLogs(arr(s)), c2=s=>setChg(arr(s));
    const c3=s=>{ o1=null; s.forEach(ch=>{ o1=ch.val().ts; }); setO(); };
    const c4=s=>{ o2=null; s.forEach(ch=>{ o2=ch.val().ts; }); setO(); };
    r1.on("value",c1); r2.on("value",c2); r3.on("value",c3); r4.on("value",c4);
    return ()=>{ r1.off("value",c1); r2.off("value",c2); r3.off("value",c3); r4.off("value",c4); };
  },[]);
  const now = new Date();
  const monthStart = Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),1);
  const due = oldest!=null && oldest<monthStart;
  const soon = now.getUTCDate()>=25;
  const names = Object.values(users).filter(x=>x&&x.username).map(x=>x.username).sort();
  const evLab = t => ({login:"LOGGED IN",logout:"LOGGED OUT",timeout:"AUTO LOGOUT (IDLE)",disconnect:"DISCONNECTED / PAGE CLOSED",blocked:"LOGIN BLOCKED (DISABLED/UNAUTHORISED)",wipe:"MONTHLY LOG WIPE"})[t]||t;
  const evCol = t => t==="login"?A.green:(t==="timeout"||t==="blocked"?A.red:(t==="disconnect"?A.orange:A.gold));
  const exportAll = async () => {
    setBusy(true); setMsg(null);
    try{
      const [a,b] = await Promise.all([db.ref("logs").orderByChild("ts").once("value"), db.ref("changes").orderByChild("ts").once("value")]);
      const rows=[["record","time_utc","username","event_or_area","target","field","from","to"]];
      a.forEach(c=>{ const v=c.val(); rows.push(["LOGIN-LOG",v.ts?new Date(v.ts).toISOString():"",v.username,v.type,"","","",""]); });
      b.forEach(c=>{ const v=c.val(); rows.push(["CHANGE",v.ts?new Date(v.ts).toISOString():"",v.username,v.area,v.target,v.field,v.from,v.to]); });
      downloadText("move-track-audit-"+new Date().toISOString().slice(0,10)+".csv",rows.map(r=>r.map(csvCell).join(",")).join("\r\n"));
      setDl(true); setMsg({ok:true,t:"DOWNLOADED "+(rows.length-1)+" RECORDS"});
    }catch(e){ setMsg({ok:false,t:"EXPORT FAILED"}); }
    setBusy(false);
  };
  const wipe = async () => {
    if(!dl && !window.confirm("You have not downloaded the logs this session. Wipe anyway? This cannot be undone.")) return;
    if(!window.confirm("Permanently delete all log and change records BEFORE "+fmtZ(monthStart)+" ?")) return;
    setBusy(true); setMsg(null);
    try{
      const [a,b] = await Promise.all([db.ref("logs").orderByChild("ts").endAt(monthStart-1).once("value"), db.ref("changes").orderByChild("ts").endAt(monthStart-1).once("value")]);
      const keys=[]; a.forEach(c=>{ keys.push("logs/"+c.key); }); b.forEach(c=>{ keys.push("changes/"+c.key); });
      for(let i=0;i<keys.length;i+=400){ const ups={}; keys.slice(i,i+400).forEach(k=>{ ups[k]=null; }); await db.ref().update(ups); }
      const me = window.MT_ME;
      await db.ref("logs").push().set({uid:me.uid,username:me.username,type:"wipe",ts:SV()});
      setMsg({ok:true,t:"WIPED "+keys.length+" RECORDS"}); setDl(false);
    }catch(e){ setMsg({ok:false,t:"WIPE FAILED"}); }
    setBusy(false);
  };
  const th = {textAlign:"left",padding:"8px 10px",fontSize:"10px",letterSpacing:"2px",color:A.dim,borderBottom:"1px solid "+A.line,fontWeight:"normal",whiteSpace:"nowrap",position:"sticky",top:0,background:A.panel};
  const td = {padding:"7px 10px",fontSize:"11px",letterSpacing:"1px",borderBottom:"1px solid "+A.line+"88",whiteSpace:"nowrap"};
  const shownL = logs.filter(l=>!flt||l.username===flt), shownC = chg.filter(l=>!flt||l.username===flt);
  return (
    <div>
      {(due||soon)&&<div style={{padding:"12px 14px",marginBottom:"12px",border:"1px solid "+(due?A.red:A.orange),background:(due?A.red:A.orange)+"14",color:due?A.red:A.orange,fontSize:"11px",letterSpacing:"1px",lineHeight:"1.7"}}>
        {due?"⚠ MONTHLY WIPE DUE — records from before "+fmtZ(monthStart)+" are ready to be wiped. DOWNLOAD THE LOGS FIRST, then wipe."
            :"⚠ MONTHLY WIPE ON THE 1ST — download this month's logs now if you need them."}
      </div>}
      <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap",marginBottom:"10px"}}>
        <button style={btnSt(view==="logins"?A.gold:A.dim)} onClick={()=>setView("logins")}>LOGINS / LOGOUTS</button>
        <button style={btnSt(view==="changes"?A.gold:A.dim)} onClick={()=>setView("changes")}>CHANGES (WHO EDITED WHAT)</button>
        <select value={flt} onChange={e=>setFlt(e.target.value)} style={{...inputSt,width:"auto",minWidth:"160px"}}>
          <option value="">ALL USERS</option>{names.map(n=><option key={n} value={n}>{n}</option>)}
        </select>
        <button style={btnSt(A.blue)} disabled={busy} onClick={exportAll}>⬇ DOWNLOAD ALL (CSV)</button>
        <button style={btnSt(A.red)} disabled={busy||!due} onClick={wipe}>WIPE PREVIOUS MONTHS</button>
      </div>
      <div style={{fontSize:"10px",color:A.dim,letterSpacing:"1px",marginBottom:"8px"}}>OLDEST RECORD: {fmtZ(oldest)} · SHOWING THE LATEST 300 OF EACH · THE WIPE BUTTON UNLOCKS ONCE A NEW MONTH BEGINS</div>
      {msg&&<div style={{marginBottom:"8px",fontSize:"11px",letterSpacing:"1px",color:msg.ok?A.green:A.red}}>{msg.ok?"✔ ":"⚠ "}{msg.t}</div>}
      <div style={{overflow:"auto",border:"1px solid "+A.line,background:A.panel,maxHeight:"460px"}}>
        {view==="logins"?<table style={{borderCollapse:"collapse",width:"100%"}}>
          <thead><tr><th style={th}>TIME (ZULU)</th><th style={th}>USER</th><th style={th}>EVENT</th></tr></thead>
          <tbody>
            {shownL.length===0&&<tr><td style={td} colSpan={3}>No activity recorded yet.</td></tr>}
            {shownL.map(l=><tr key={l.id}><td style={td}>{fmtZ(l.ts)}</td><td style={{...td,color:"#fff"}}>{l.username}</td><td style={{...td,color:evCol(l.type)}}>{evLab(l.type)}</td></tr>)}
          </tbody></table>
        :<table style={{borderCollapse:"collapse",width:"100%"}}>
          <thead><tr><th style={th}>TIME (ZULU)</th><th style={th}>USER</th><th style={th}>AREA</th><th style={th}>TARGET</th><th style={th}>FIELD</th><th style={th}>FROM</th><th style={th}>TO</th></tr></thead>
          <tbody>
            {shownC.length===0&&<tr><td style={td} colSpan={7}>No changes recorded yet.</td></tr>}
            {shownC.map(l=><tr key={l.id}><td style={td}>{fmtZ(l.ts)}</td><td style={{...td,color:"#fff"}}>{l.username}</td><td style={{...td,color:A.gold}}>{l.area}</td><td style={td}>{l.target}</td><td style={td}>{l.field}</td><td style={{...td,color:A.dim}}>{l.from||"—"}</td><td style={{...td,color:A.green}}>{l.to||"—"}</td></tr>)}
          </tbody></table>}
      </div>
    </div>
  );
}

  );

// ───────── ROOT: login gate, session audit, idle timeout ─────────
function Root(){
  const [ready,setReady] = useState(false);
  const [user,setUser] = useState(null);
  const [profile,setProfile] = useState(null);
  const [notice,setNotice] = useState("");
  const [showAcct,setShowAcct] = useState(false);
  const sess = useRef({});

  const endSession = async (type) => {
    const s = sess.current;
    if(!s||!s.uid) return;
    sess.current = {};
    clearInterval(s.hb);
    try{ s.conn.off("value",s.onConn); }catch(e){}
    try{ if(s.dc) s.dc.onDisconnect().cancel(); s.pres.onDisconnect().cancel(); }catch(e){}
    if(type){
      try{
        await Promise.race([
          Promise.all([
            db.ref("logs").push().set({uid:s.uid,username:s.uname,type:type,ts:SV()}),
            s.pres.update({online:false,lastLogout:SV(),lastSeen:SV()})
          ]),
          new Promise(r=>setTimeout(r,4000))
        ]);
      }catch(e){}
    }
  };
  const doSignOut = async () => { window.MT_ME = null; try{ await window.auth.signOut(); }catch(e){} };
  const logout = async (type,msg) => {
    await endSession(type||"logout");
    if(msg) setNotice(msg);
    setProfile(null);
    await doSignOut();
  };
  const forceOut = async (msg) => {
    await endSession(null);
    setNotice(msg); setProfile(null);
    await doSignOut();
  };
  const login = async (username,password) => {
    setNotice("");
    await window.auth.setPersistence(firebase.auth.Auth.Persistence.NONE);   // session lives in memory only: refresh = log in again
    await window.auth.signInWithEmailAndPassword(toEmail(username),password);
  };

  useEffect(()=>{
    if(!cfgOk()){ setReady(true); return; }
    window.auth.setPersistence(firebase.auth.Auth.Persistence.NONE).catch(()=>{});
    return window.auth.onAuthStateChanged(u=>{
      setUser(u||null);
      if(!u) setProfile(null);
      setReady(true);
    });
  },[]);

  // Own profile: role, permissions, disabled flag. Admin changes apply live.
  useEffect(()=>{
    if(!user) return;
    const ref = db.ref("users/"+user.uid);
    const cb = snap => {
      const p = snap.val();
      if(!p) forceOut("NO ACCESS — THIS ACCOUNT IS NOT AUTHORISED");
      else if(p.disabled===true){
        db.ref("logs").push().set({uid:user.uid,username:p.username||"?",type:"blocked",ts:SV()}).catch(()=>{});
        forceOut("ACCOUNT DISABLED — CONTACT ADMIN");
      } else { window.MT_ME = {uid:user.uid,username:p.username}; setProfile(p); }
    };
    ref.on("value",cb,()=>forceOut("ACCESS DENIED"));
    return ()=>ref.off("value",cb);
  },[user&&user.uid]);

  // Session audit: login record, presence, heartbeat, disconnect record
  useEffect(()=>{
    if(!user||!profile) return;
    const uid=user.uid, uname=profile.username;
    const pres=db.ref("presence/"+uid), conn=db.ref(".info/connected");
    let first=true;
    const onConn = snap => {
      if(snap.val()!==true) return;
      if(first){
        first=false;
        db.ref("logs").push().set({uid:uid,username:uname,type:"login",ts:SV()});
        pres.update({username:uname,lastLogin:SV()});
      }
      const dc = db.ref("logs").push();
      dc.onDisconnect().set({uid:uid,username:uname,type:"disconnect",ts:SV()});
      pres.onDisconnect().update({online:false,lastSeen:SV()});
      pres.update({online:true,lastSeen:SV()});
      sess.current.dc = dc;
    };
    const hb = setInterval(()=>pres.update({lastSeen:SV()}),60000);
    sess.current = {uid:uid,uname:uname,pres:pres,conn:conn,onConn:onConn,hb:hb,dc:null};
    conn.on("value",onConn);
    return ()=>{ clearInterval(hb); try{conn.off("value",onConn);}catch(e){} };
  },[user&&user.uid, profile&&profile.username]);

  // Idle auto-logout (minutes set per user by the admin; 0 = never)
  const idleMin = profile ? (profile.idleMin==null?DEFAULT_IDLE:profile.idleMin) : 0;
  useEffect(()=>{
    if(!user||!profile||!idleMin) return;
    let last = Date.now();
    const bump = ()=>{ last=Date.now(); };
    const evs = ["mousemove","keydown","touchstart","click","scroll"];
    evs.forEach(e=>window.addEventListener(e,bump,{passive:true}));
    const t = setInterval(()=>{ if(Date.now()-last>idleMin*60000) logout("timeout","LOGGED OUT — INACTIVE FOR "+idleMin+" MINUTES"); },15000);
    return ()=>{ evs.forEach(e=>window.removeEventListener(e,bump)); clearInterval(t); };
  },[user&&user.uid, !!profile, idleMin]);

  if(!cfgOk()) return <SetupNeeded/>;
  if(!ready) return <Splash text="STARTING..."/>;
  if(!user) return <LoginScreen notice={notice} onLogin={login}/>;
  if(!profile) return <Splash text="VERIFYING ACCESS..."/>;
  return (
    <>
      <App user={user} profile={profile} onLogout={()=>logout("logout")} onAccount={()=>setShowAcct(true)}/>
      {showAcct&&<AccountModal user={user} profile={profile} onClose={()=>setShowAcct(false)}/>}
    </>
  );
}

// MAIN APP
function App({user,profile,onLogout,onAccount}){
  const myUid = user.uid;
  const isAdmin = profile.role==="admin";
  const perms = profile.perms||{};
  const [roster,setRoster] = useState({});
  const [board,setBoard] = useState({});
  const [ao,setAo] = useState({});
  const [evacOpen,setEvacOpen] = useState(true);
  const [dbErr,setDbErr] = useState("");
  const [locs,setLocs] = useState(DEFAULT_LOCS);
  const [locs2,setLocs2] = useState(DEFAULT_LOCS2);
  const [statuses,setStatuses] = useState(DEFAULT_STATUSES);
  const [newStatus,setNewStatus] = useState("");
  const [newLoc2,setNewLoc2] = useState("");
  const [vehicles,setVehicles] = useState(()=>Array.from({length:100},(_,i)=>({id:i+1,make:"",model:"",colour:"",vrn:"",name:"",location:"",purpose:"",dateon:"",mileageon:""})));
  const [fuelCards,setFuelCards] = useState(()=>Array.from({length:30},(_,i)=>({id:i+1,cardnum:"",name:"",notes:"",location:""})));
  const [tab,setTab] = useState("board");
  const [newLoc,setNewLoc] = useState("");
  const [bhr,setBhr] = useState(bhrNow());
  const [zulu,setZulu] = useState(zuluNow());
  const [connected,setConnected] = useState(false);
  const [picker,setPicker] = useState(null);
  const [vehDatePicker,setVehDatePicker] = useState(null); // {idx}
  const [rooms,setRooms] = useState({});
  const [fpNums,setFpNums] = useState({});
  const [evacData,setEvacData] = useState({});
  const [restrictions,setRestrictions] = useState({});
  const [markers,setMarkers] = useState({});
  const [nightHours,setNightHours] = useState("2000-0600");
  const [installable,setInstallable] = useState(!!window.deferredInstallPrompt);
  const [installed,setInstalled] = useState(false);
  const [wipeFlag,setWipeFlag] = useState(null); // admin only: "due" | "soon" | null

  // Who can edit what (the database rules enforce the same thing server-side)
  const locsUnlocked = isAdmin;
  const canEditOthers = isAdmin || !!perms.editOthers;
  const canVeh = isAdmin || !!perms.vehicles;
  const canRooms = isAdmin || !!perms.rooms;
  const canFp = isAdmin || !!perms.fp;
  const canEvac = isAdmin || !!perms.evac || evacOpen;

  // Board rows come from the roster (one line per person), highest rank first
  const rows = Object.entries(roster)
    .filter(([uid,r])=>r&&r.name&&r.onBoard!==false)
    .map(([uid,r])=>({uid:uid,name:r.name,rank:r.rank||"",rankOrder:r.rankOrder||0,location:"",location2:"",status:"",dueBack:"",dueDate:"",notes:"",...(board[uid]||{})}))
    .sort((a,b)=>b.rankOrder-a.rankOrder||a.name.localeCompare(b.name));
  const rowsRef = useRef(rows);
  rowsRef.current = rows;

  useEffect(()=>{
    if(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone){
      setInstalled(true);
    }
    window.addEventListener('pwa-installable',()=>setInstallable(true));
    window.addEventListener('appinstalled',()=>{setInstalled(true);setInstallable(false);});
  },[]);

  useEffect(()=>{
    const clk = setInterval(()=>{setBhr(bhrNow());setZulu(zuluNow());},1000);
    const err = e => setDbErr((e&&e.message)||"Database error");
    const subs = [];
    const on = (path,cb) => { const r=db.ref(path); r.on("value",cb,err); subs.push([r,cb]); };
    on("roster",snap=>{ setRoster(snap.val()||{}); setConnected(true); });
    on("board",snap=>{ setBoard(snap.val()||{}); });
    on("locations",snap=>{ const v=snap.val(); if(Array.isArray(v)&&v.length>0)setLocs(v); });
    on("locations2",snap=>{
      const v=snap.val();
      const a = Array.isArray(v) ? v.filter(Boolean) : (v ? Object.values(v) : []);
      setLocs2(a.sort((x,y)=>String(x).localeCompare(String(y))));
    });
    on("statuses",snap=>{ const v=snap.val(); if(Array.isArray(v)&&v.length>0)setStatuses(v); });
    on("vehicles",snap=>{
      const data=snap.val()||{};
      setVehicles(Array.from({length:100},(_,i)=>({id:i+1,make:"",model:"",colour:"",vrn:"",name:"",location:"",purpose:"",dateon:"",mileageon:"",...(data[i]||{})})));
    });
    on("fuelcards",snap=>{
      const data=snap.val()||{};
      setFuelCards(Array.from({length:30},(_,i)=>({id:i+1,cardnum:"",name:"",notes:"",location:"",...(data[i]||{})})));
    });
    on("rooms",snap=>{ setRooms(snap.val()||{}); });
    on("fpnumbers",snap=>{ setFpNums(snap.val()||{}); });
    on("evac",snap=>{ setEvacData(snap.val()||{}); });
    on("restrictions",snap=>{ setRestrictions(snap.val()||{}); });
    on("markers",snap=>{ setMarkers(snap.val()||{}); });
    on("settings",snap=>{
      const v=snap.val()||{}; const a=v.ao||{};
      AO.tz = a.tz||"UTC"; AO.set = !!a.country;
      setAo(a); setEvacOpen(v.evacOpen!==false); setNightHours(v.nightHours||"2000-0600");
      setBhr(bhrNow());
    });
    return()=>{ clearInterval(clk); subs.forEach(([r,cb])=>r.off("value",cb)); };
  },[]);

  // Admins get a reminder about the monthly log wipe on every tab
  useEffect(()=>{
    if(!isAdmin) return;
    const r1=db.ref("logs").orderByChild("ts").limitToFirst(1), r2=db.ref("changes").orderByChild("ts").limitToFirst(1);
    let o1=null,o2=null;
    const calc = () => {
      const n=new Date(), ms=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),1);
      const o=[o1,o2].filter(x=>x!=null); const old=o.length?Math.min.apply(null,o):null;
      setWipeFlag(old!=null&&old<ms?"due":(n.getUTCDate()>=25&&old!=null?"soon":null));
    };
    const c1=s=>{ o1=null; s.forEach(ch=>{ o1=ch.val().ts; }); calc(); };
    const c2=s=>{ o2=null; s.forEach(ch=>{ o2=ch.val().ts; }); calc(); };
    r1.on("value",c1,()=>{}); r2.on("value",c2,()=>{});
    return ()=>{ r1.off("value",c1); r2.off("value",c2); };
  },[isAdmin]);

  // Change audit: waits 1s after the last keystroke, then records one "from → to" entry
  const auditT = useRef({});
  const audit = (area,target,field,oldV,newV) => {
    const k=area+"|"+target+"|"+field, t=auditT.current;
    if(t[k]) clearTimeout(t[k].tm); else t[k]={oldV:oldV};
    t[k].newV=newV;
    t[k].tm=setTimeout(()=>{ const e=t[k]; delete t[k]; if(String(e.oldV==null?"":e.oldV)===String(e.newV==null?"":e.newV)) return; auditNow(area,target,field,e.oldV,e.newV); },1000);
  };

  const rowName = uid => { const r=rowsRef.current.find(x=>x.uid===uid); return r?r.name:uid; };
  const writeBoard = (uid,u) => {
    if(!(uid===myUid||canEditOthers)) return;
    const r=rowsRef.current.find(x=>x.uid===uid)||{};
    Object.keys(u).forEach(k=>audit("BOARD",rowName(uid),k,r[k],u[k]));
    db.ref("board/"+uid).update(u);
  };
  const updateRow = (uid,field,val) => {
    const u={}; u[field]=val;
    if(field==="status"&&val==="IN"){u.dueBack="";u.dueDate="";}
    writeBoard(uid,u);
  };
  const addLocation2 = name => {
    const n=String(name||"").trim().toUpperCase().slice(0,40); if(!n) return;
    if(locs2.map(x=>String(x).toUpperCase()).includes(n)) return;
    db.ref("locations2/"+keyOf(n)).set(n);
    auditNow("LOCATIONS","LOCATION LIST","add","",n);
  };
  const setPersonLocation = (uid,name) => { addLocation2(name); updateRow(uid,"location2",String(name).trim().toUpperCase().slice(0,40)); };

  const writeLocs = l => db.ref("locations").set(l);
  const writeStatuses = s => db.ref("statuses").set(s);
  const writeRoom = (name,val) => { const k=name.replace(/[^a-zA-Z0-9]/g,"_"); if(!canRooms)return; audit("ROOMS",name,"room",rooms[k],val); db.ref("rooms/"+k).set(val); };
  const writeFP = (name,val) => { const k=name.replace(/[^a-zA-Z0-9]/g,"_"); if(!canFp)return; audit("FP NUMBERS",name,"fp number",fpNums[k],val); db.ref("fpnumbers/"+k).set(val); };
  const writeEvac = (vehIdx,field,val) => { if(!canEvac)return; const old=(evacData["v"+vehIdx]||{})[field]; audit("EVAC","VEH "+(vehIdx+1),field,old,val); const u={}; u[field]=val; db.ref("evac/v"+vehIdx).update(u); };
  const setEvacCount = n => { if(!canEvac)return; const old=(evacData.meta||{}).count; audit("EVAC","VEHICLE COUNT","count",old||"10",String(n)); db.ref("evac/meta/count").set(String(n)); };
  const writeVehicle = (i,f,v) => { if(!canVeh)return; const cur=vehicles[i]||{}; audit("VEHICLES","VEH "+(i+1)+(cur.vrn?" "+cur.vrn:""),f,cur[f],v); const u={}; u[f]=v; db.ref("vehicles/"+i).update(u); };
  const writeFuelCard = (i,f,v) => { if(!canVeh)return; const cur=fuelCards[i]||{}; audit("FUEL CARDS","CARD "+(i+1)+(cur.cardnum?" "+cur.cardnum:""),f,cur[f],v); const u={}; u[f]=v; db.ref("fuelcards/"+i).update(u); };

  const addLoc = () => {
    if(!locsUnlocked)return;
    const v=newLoc.trim().toUpperCase();
    if(!v||locs.includes(v))return;
    const next=[...locs,v]; setLocs(next); writeLocs(next); setNewLoc(""); auditNow("LOCATIONS","BED DOWN LIST","add","",v);
  };
  const addStatus = () => {
    if(!locsUnlocked)return;
    const v=newStatus.trim().toUpperCase();
    if(!v||statuses.includes(v))return;
    const next=[...statuses,v]; setStatuses(next); writeStatuses(next); setNewStatus(""); auditNow("LOCATIONS","STATUS LIST","add","",v);
  };
  const removeStatus = st => {
    if(!locsUnlocked)return;
    const next=statuses.filter(s=>s!==st); setStatuses(next); writeStatuses(next); auditNow("LOCATIONS","STATUS LIST","remove",st,"");
    rowsRef.current.forEach(r=>{ if(r.status===st)db.ref("board/"+r.uid).update({status:""}); });
  };
  const addLoc2 = () => {
    if(!locsUnlocked)return;
    addLocation2(newLoc2); setNewLoc2("");
  };
  const removeLoc2 = loc => {
    if(!locsUnlocked)return;
    db.ref("locations2/"+keyOf(loc)).remove();
    auditNow("LOCATIONS","LOCATION LIST","remove",loc,"");
    rowsRef.current.forEach(r=>{ if(r.location2===loc)db.ref("board/"+r.uid).update({location2:""}); });
  };
  const removeLoc = loc => {
    if(!locsUnlocked)return;
    const next=locs.filter(l=>l!==loc); setLocs(next); writeLocs(next); auditNow("LOCATIONS","BED DOWN LIST","remove",loc,"");
    rowsRef.current.forEach(r=>{ if(r.location===loc)db.ref("board/"+r.uid).update({location:""}); });
  };

  const locColorMap = {};
  locs.forEach((l,i)=>{ const c=PAL[i%PAL.length]; locColorMap[l]={color:c,bg:c+"22"}; });
  locColorMap[""]={color:"#5a6a7a",bg:"transparent"};
  const loc2ColorMap = {};
  locs2.forEach((l,i)=>{ const c=PAL[(i+5)%PAL.length]; loc2ColorMap[l]={color:c,bg:c+"22"}; });
  loc2ColorMap[""]={color:"#5a6a7a",bg:"transparent"};

  const sCounts={},lCounts={},l2Counts={};let filled=0,odCount=0;
  rows.forEach(r=>{
    if(r.name)filled++;
    if(isOvd(r))odCount++;
    if(r.status)sCounts[r.status]=(sCounts[r.status]||0)+1;
    if(r.location)lCounts[r.location]=(lCounts[r.location]||0)+1;
    if(r.location2)l2Counts[r.location2]=(l2Counts[r.location2]||0)+1;
  });
  const odRows = rows.filter(r=>r.name&&isOvd(r));

  const f = { mono:"'Share Tech Mono',monospace", sans:"'Barlow Condensed',sans-serif" };
  const s = {
    wrap:{background:"#080a0d",minHeight:"100vh",color:"#d4dde8",fontFamily:f.mono,fontSize:"13px"},
    header:{background:"#0d1117",borderBottom:"2px solid #c9a84c",padding:"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"12px"},

    cw:{textAlign:"right"},

    fill:{color:"#c9a84c",fontSize:"11px",letterSpacing:"2px",marginTop:"4px"},
    tabs:{display:"flex",borderBottom:"1px solid #1e2630",background:"#0a0c0f",flexWrap:"wrap"},
    tab:a=>({background:a?"#0f1318":"transparent",border:"none",borderBottom:a?"2px solid #c9a84c":"2px solid transparent",color:a?"#c9a84c":"#5a6a7a",fontFamily:f.mono,fontSize:"11px",letterSpacing:"2px",padding:"11px 20px",cursor:"pointer",textTransform:"uppercase",marginBottom:"-1px"}),
    body:{padding:"14px 20px"},
    sr:{display:"flex",gap:"8px",marginBottom:"10px",flexWrap:"wrap"},
    sc:c=>({background:"#0f1318",border:"1px solid "+c+"33",padding:"7px 12px",display:"flex",alignItems:"center",gap:"7px"}),
    sn:c=>({fontSize:"20px",fontWeight:"bold",color:c,fontFamily:f.mono}),
    sl:{fontSize:"9px",color:"#5a6a7a",letterSpacing:"1px",textTransform:"uppercase"},
    alert:{background:"rgba(231,76,60,0.1)",border:"1px solid #e74c3c",borderLeft:"4px solid #e74c3c",padding:"10px 16px",marginBottom:"12px",animation:"alertpulse 1.5s infinite"},
    aTitle:{color:"#e74c3c",fontSize:"10px",letterSpacing:"3px",marginBottom:"8px"},
    aTag:{display:"inline-block",background:"rgba(231,76,60,0.2)",border:"1px solid rgba(231,76,60,0.5)",color:"#ff8a80",padding:"3px 8px",fontSize:"11px",marginRight:"6px",marginBottom:"4px"},
    tw:{background:"#0f1318",border:"1px solid #1e2630",overflowX:"auto"},
    th:{background:"#0d1117",borderBottom:"1px solid #7a6330",color:"#c9a84c",fontSize:"9px",letterSpacing:"3px",padding:"10px 12px",textAlign:"left",fontWeight:"normal",whiteSpace:"nowrap",textTransform:"uppercase"},

    sel:(val,map)=>({appearance:"none",WebkitAppearance:"none",background:map[val]?map[val].bg||"#0a0c0f":"#0a0c0f",border:"1px solid "+(map[val]?map[val].color||"#1e2630":"#1e2630")+"55",color:map[val]?map[val].color||"#5a6a7a":"#5a6a7a",fontFamily:f.mono,fontSize:"11px",padding:"4px 6px",cursor:"pointer",outline:"none",width:"100%",borderRadius:"0"}),
    tBtn:dis=>({background:dis?"transparent":"#080a0d",border:"1px solid "+(dis?"#1e2630":"#c9a84c55"),color:dis?"#2a3440":"#c9a84c",fontFamily:f.mono,fontSize:"11px",padding:"4px 7px",cursor:dis?"not-allowed":"pointer",letterSpacing:"1px",minWidth:"100px",textAlign:"center",lineHeight:"1.4"}),
    ni2:{background:"transparent",border:"none",borderBottom:"1px solid transparent",color:"#5a6a7a",fontFamily:f.mono,fontSize:"11px",padding:"3px 4px",outline:"none",width:"100%",minWidth:"100px"},
    badge:{background:"#e74c3c",color:"#fff",fontSize:"8px",padding:"1px 5px",marginLeft:"4px",letterSpacing:"1px",verticalAlign:"middle"},
    odT:{color:"#e74c3c",fontSize:"10px",marginLeft:"4px"},
    footer:{marginTop:"16px",paddingTop:"10px",borderTop:"1px solid #1e2630",fontSize:"10px",color:"#5a6a7a",letterSpacing:"1px",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:"4px"},
    addRow:{display:"flex",gap:"8px",marginBottom:"6px"},
    addInp:{flex:"1",background:"#0f1318",border:"1px solid #1e2630",color:"#fff",fontFamily:f.mono,fontSize:"13px",padding:"9px 12px",outline:"none",textTransform:"uppercase"},
    addBtn:{background:"rgba(201,168,76,0.1)",border:"1px solid #c9a84c",color:"#c9a84c",fontFamily:f.mono,fontSize:"12px",letterSpacing:"2px",padding:"9px 16px",cursor:"pointer"},
    locGrid:{display:"flex",flexWrap:"wrap",gap:"8px",marginTop:"16px"},
    locChip:c=>({background:c+"14",border:"1px solid "+c+"44",color:c,fontFamily:f.mono,fontSize:"12px",letterSpacing:"1px",padding:"7px 12px",display:"flex",alignItems:"center",gap:"8px"}),
    rmBtn:{background:"transparent",border:"none",color:"#e74c3c",cursor:"pointer",fontSize:"14px",padding:"0",lineHeight:"1"},
    hint:{marginBottom:"16px",fontSize:"11px",color:"#5a6a7a",letterSpacing:"1px"},
    secT:{margin:"18px 0 10px",fontSize:"10px",color:"#c9a84c",letterSpacing:"3px"},
    warn:{marginTop:"16px",background:"rgba(231,76,60,0.06)",border:"1px solid rgba(231,76,60,0.2)",padding:"10px 14px",fontSize:"11px",color:"#8a9aaa"},
    dh:{color:"#2a3440",cursor:"grab",fontSize:"16px",padding:"0 4px",userSelect:"none",WebkitUserSelect:"none"},
    conn:{textAlign:"center",padding:"60px 20px",color:"#5a6a7a",fontSize:"12px",letterSpacing:"3px"},
  };

  const SDEFS=[{key:"IN",label:"In Loc",color:"#2ecc71"},{key:"OUT",label:"Out",color:"#e74c3c"},{key:"R&R",label:"R&R",color:"#3498db"},{key:"MEDICAL",label:"Medical",color:"#f39c12"},{key:"TASKING",label:"Tasking",color:"#9b59b6"},{key:"TOTAL",label:"Total",color:"#c9a84c"},{key:"OVERDUE",label:"Overdue",color:"#e74c3c"}];



  if(!connected) return (
    <div style={s.wrap}>
      <div style={s.header}>
        <div><div style={s.title}>MOVING <span style={s.gold}>&</span> TRACKING</div><div style={s.sub}>Bed Down Location (BDL) Status Board // Live Personnel Tracking</div></div>
