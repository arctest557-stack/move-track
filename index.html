                  {installable&&<>
                    <div style={{color:"#5a6a7a",fontSize:"11px",letterSpacing:"1px",marginBottom:"14px",lineHeight:"1.7"}}>Tap the button below to install Moving & Tracking as an app on this device.</div>
                    <button
                      onClick={()=>{if(window.deferredInstallPrompt){window.deferredInstallPrompt.prompt();window.deferredInstallPrompt.userChoice.then(r=>{if(r.outcome==="accepted"){setInstalled(true);setInstallable(false);}});}}}
                      style={{background:"rgba(201,168,76,0.15)",border:"1px solid #c9a84c",color:"#c9a84c",fontFamily:f.mono,fontSize:"13px",letterSpacing:"2px",padding:"12px 24px",cursor:"pointer",width:"100%",marginBottom:"20px"}}
                    >📲 INSTALL NOW</button>
                  </>}
                  <div style={{background:"#0f1318",border:"1px solid #1e2630",padding:"16px",marginBottom:"12px"}}>
                    <div style={{color:"#c9a84c",fontSize:"10px",letterSpacing:"3px",marginBottom:"10px"}}>ANDROID — CHROME</div>
                    <div style={{color:"#d4dde8",fontSize:"12px",lineHeight:"1.8",letterSpacing:"0.5px"}}>
                      1. Tap the <span style={{color:"#c9a84c"}}>⋮</span> menu (top right)<br/>
                      2. Tap <span style={{color:"#c9a84c"}}>"Add to Home screen"</span><br/>
                      3. Tap <span style={{color:"#c9a84c"}}>"Install"</span>
                    </div>
                  </div>
                  <div style={{background:"#0f1318",border:"1px solid #1e2630",padding:"16px"}}>
                    <div style={{color:"#c9a84c",fontSize:"10px",letterSpacing:"3px",marginBottom:"10px"}}>iPHONE — SAFARI</div>
                    <div style={{color:"#d4dde8",fontSize:"12px",lineHeight:"1.8",letterSpacing:"0.5px"}}>
                      1. Tap the <span style={{color:"#c9a84c"}}>⎙ Share</span> button (bottom bar)<br/>
                      2. Scroll down and tap <span style={{color:"#c9a84c"}}>"Add to Home Screen"</span><br/>
                      3. Tap <span style={{color:"#c9a84c"}}>"Add"</span>
                    </div>
                  </div>
                </>
            }
          </div>
        </>}

      {vehDatePicker&&<VehicleDatePicker
        value={vehicles[vehDatePicker.idx]?.dateon||""}
        onConfirm={val=>{const i=vehDatePicker.idx;setVehicles(prev=>{const n=[...prev];n[i]={...n[i],dateon:val};return n;});writeVehicle(i,"dateon",val);setVehDatePicker(null);}}
        onClose={()=>setVehDatePicker(null)}
      />}
      {picker&&<TimePicker time={picker.time} date={picker.date} onConfirm={(t,d)=>{updateRow(picker.idx,"dueBack",t);updateRow(picker.idx,"dueDate",d);setPicker(null);}} onClear={()=>{updateRow(picker.idx,"dueBack","");updateRow(picker.idx,"dueDate","");setPicker(null);}} onClose={()=>setPicker(null)}/>}

        {/* ROOMS TAB */}
        {tab==="rooms"&&<fieldset disabled={!canRooms}>
          {!canRooms&&<div style={{marginBottom:"12px",padding:"8px 14px",border:"1px solid #1e2630",background:"#0d1117",color:"#8a9aaa",fontSize:"11px",letterSpacing:"1px"}}>👁 VIEW ONLY — only admins and the BDL Rooms (G4) function can edit this tab.</div>}
          <div style={{...s.hint,marginBottom:"14px"}}>BDL ROOM NUMBERS — MIRRORS BOARD NAMES</div>
          <div style={s.tw}>
            <table style={{width:"100%",borderCollapse:"collapse"}}>
              <thead><tr>{["#","Name","Room Number"].map(h=><th key={h} style={s.th}>{h}</th>)}</tr></thead>
              <tbody>
                {rows.filter(r=>r.name).map((r,i)=>{
                  const key=r.name.replace(/[^a-zA-Z0-9]/g,"_");
                  return <tr key={r.name} style={{borderBottom:"1px solid rgba(30,38,48,0.7)"}}>
                    <td style={{...s.td,color:"#5a6a7a",fontSize:"11px",width:"28px"}}>{String(i+1).padStart(2,"0")}</td>
                    <td style={{...s.td,minWidth:"160px"}}><span style={{color:"#fff",fontFamily:f.mono,fontSize:"12px",letterSpacing:"1px"}}>{r.name}</span></td>
                    <td style={{...s.td,minWidth:"140px"}}>
                      <input style={{...s.inp,textTransform:"none",letterSpacing:"1px"}} value={rooms[key]||""} placeholder="Room no." maxLength={20}
                        onChange={e=>{const v=e.target.value;setRooms(prev=>({...prev,[key]:v}));writeRoom(r.name,v);}}/>
                    </td>
                  </tr>;
                })}
              </tbody>
            </table>
          </div>
          {rows.filter(r=>r.name).length===0&&<div style={{color:"#5a6a7a",fontSize:"11px",letterSpacing:"1px",padding:"20px 0"}}>No personnel yet — the admin creates users in the Admin tab.</div>}
        </fieldset>}

        {/* FP NUMBERS TAB */}
        {tab==="fp"&&<fieldset disabled={!canFp}>
          {!canFp&&<div style={{marginBottom:"12px",padding:"8px 14px",border:"1px solid #1e2630",background:"#0d1117",color:"#8a9aaa",fontSize:"11px",letterSpacing:"1px"}}>👁 VIEW ONLY — only admins and the FP Numbers (G6) function can edit this tab.</div>}
          <div style={{...s.hint,marginBottom:"14px"}}>FP NUMBERS — FORCE PROTECTION PHONE NUMBERS</div>
          <div style={s.tw}>
            <table style={{width:"100%",borderCollapse:"collapse"}}>
              <thead><tr>{["#","Name","FP Number"].map(h=><th key={h} style={s.th}>{h}</th>)}</tr></thead>
              <tbody>
                {rows.filter(r=>r.name).map((r,i)=>{
                  const key=r.name.replace(/[^a-zA-Z0-9]/g,"_");
                  return <tr key={r.name} style={{borderBottom:"1px solid rgba(30,38,48,0.7)"}}>
                    <td style={{...s.td,color:"#5a6a7a",fontSize:"11px",width:"28px"}}>{String(i+1).padStart(2,"0")}</td>
                    <td style={{...s.td,minWidth:"160px"}}><span style={{color:"#fff",fontFamily:f.mono,fontSize:"12px",letterSpacing:"1px"}}>{r.name}</span></td>
                    <td style={{...s.td,minWidth:"160px"}}>
                      <input style={{...s.inp,textTransform:"none",letterSpacing:"2px"}} value={fpNums[key]||""} placeholder="FP number" maxLength={20}
                        onChange={e=>{const v=e.target.value;setFpNums(prev=>({...prev,[key]:v}));writeFP(r.name,v);}}/>
                    </td>
                  </tr>;
                })}
              </tbody>
            </table>
          </div>
          {rows.filter(r=>r.name).length===0&&<div style={{color:"#5a6a7a",fontSize:"11px",letterSpacing:"1px",padding:"20px 0"}}>No personnel yet — the admin creates users in the Admin tab.</div>}
        </fieldset>}

        {/* EVAC PAX LIST TAB */}
        {tab==="evac"&&<fieldset disabled={!canEvac}>{!canEvac&&<div style={{marginBottom:"12px",padding:"8px 14px",border:"1px solid #1e2630",background:"#0d1117",color:"#8a9aaa",fontSize:"11px",letterSpacing:"1px"}}>👁 VIEW ONLY — EVAC editing is limited to admins and the EVAC (Force Protection) function.</div>}<EvacTab evacData={evacData} writeEvac={writeEvac} setEvacCount={setEvacCount} vehicles={vehicles} rows={rows} f={f} s={s}/></fieldset>}

        {/* AO MAP TAB */}
        {tab==="map"&&<AOMap f={f} rows={rows} locs2={locs2} ao={ao} myUid={myUid} canEditOthers={canEditOthers} setPersonLocation={setPersonLocation} isAdmin={isAdmin} restrictions={restrictions} nightHours={nightHours} markers={markers}/>}

      </div>

      {/* Install popup - shows once, dismissed if already installed */}
      {installable&&!installed&&tab!=="install"&&<InstallBanner onInstall={()=>{if(window.deferredInstallPrompt){window.deferredInstallPrompt.prompt();window.deferredInstallPrompt.userChoice.then(r=>{if(r.outcome==="accepted"){setInstalled(true);setInstallable(false);}});}}} onDismiss={()=>setInstallable(false)} f={f}/>}
    </div>
  );
}

function AOMap({f,rows,locs2,ao,myUid,canEditOthers,setPersonLocation,isAdmin,restrictions,nightHours,markers}){
  const mapRef = React.useRef(null);
  const mapInstanceRef = React.useRef(null);
  const districtLayersRef = React.useRef([]);
  const offLayersRef = React.useRef([]);
  const nightLayersRef = React.useRef([]);
  const regionLayerRef = React.useRef(null);
  const regionLayersRef = React.useRef({});
  const circleLayersRef = React.useRef([]);
  const previewRef = React.useRef(null);
  const baseLayersRef = React.useRef({});
  const previewMRef = React.useRef(null);
  const [base,setBase] = React.useState("dark");
  const markerRef = React.useRef(null);
  const [selected,setSelected] = React.useState(null);
  const [status,setStatus] = React.useState("loading");
  const [districts,setDistricts] = React.useState([]);
  const [showOff,setShowOff] = React.useState(true);
  const [showNight,setShowNight] = React.useState(true);
  const [locPick,setLocPick] = React.useState(null); // {district} — set location popup
  const [q,setQ] = React.useState("");
  const [results,setResults] = React.useState([]);
  const [searching,setSearching] = React.useState(false);
  const [searchErr,setSearchErr] = React.useState("");
  const [level,setLevel] = React.useState("ADM1");
  const [geoState,setGeoState] = React.useState("idle"); // idle | loading | ok | none | error
  const [names,setNames] = React.useState([]);
  const [tileNote,setTileNote] = React.useState("");
  const [draft,setDraft] = React.useState({name:"",type:"off",radius:"2",lat:null,lng:null});
  const [placing,setPlacing] = React.useState(false);
  const [mDraft,setMDraft] = React.useState({name:"",note:"",color:"#3498db",lat:null,lng:null});
  const [placingM,setPlacingM] = React.useState(false);
  const [pDraft,setPDraft] = React.useState({name:"",type:"off",pts:[]});
  const [placingP,setPlacingP] = React.useState(false);
  const placingPRef = React.useRef(false); placingPRef.current = placingP;
  const previewPRef = React.useRef(null);
  const [showMk,setShowMk] = React.useState(true);
  const mkLayersRef = React.useRef([]);
  const placingMRef = React.useRef(false); placingMRef.current = placingM;
  const [adminMsg,setAdminMsg] = React.useState(null);
  const [nh,setNh] = React.useState(nightHours);
  const fnt = f.mono;
  const iso3 = iso3Of(ao);
  const regionList = ((window.MT_GEO&&window.MT_GEO.regions)||{})[ao.country]||[];
  const myRow = rows.find(r=>r.uid===myUid);

  // refs so Leaflet's long-lived handlers always see the latest values
  const placingRef = React.useRef(false); placingRef.current = placing;
  const restrictionsRef = React.useRef(restrictions); restrictionsRef.current = restrictions;
  const nhRef = React.useRef(nightHours); nhRef.current = nightHours;
  const levelRef = React.useRef(level); levelRef.current = level;
  const selectRef = React.useRef(null);

  React.useEffect(()=>{ setNh(nightHours); },[nightHours]);

  const DEF_STYLE   = {color:"#2ecc71",weight:1.5,fillColor:"#2ecc71",fillOpacity:0.08,opacity:0.7};
  const SEL_STYLE   = {color:"#c9a84c",weight:3,fillColor:"#c9a84c",fillOpacity:0.4,opacity:1};
  const HOV_STYLE   = {color:"#2ecc71",weight:2.5,fillColor:"#2ecc71",fillOpacity:0.25,opacity:1};
  const OFF_STYLE   = {color:"#e74c3c",weight:2,fillColor:"#e74c3c",fillOpacity:0.4,opacity:1};
  const NIGHT_STYLE = {color:"#f39c12",weight:2,fillColor:"#f39c12",fillOpacity:0.35,opacity:1};

  const tipHtml = (name,type)=>{
    const bg = type==="off"?"#e74c3c":(type==="night"?"#f39c12":"#0f1318");
    const fg = type==="night"?"#000":"#fff";
    const label = type==="off"?"🔴 OFF LIMITS":(type==="night"?"🟡 NIGHT RESTRICTION "+nhRef.current:"");
    const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    return '<div style="font-family:Share Tech Mono,monospace;color:'+fg+';background:'+bg+';padding:4px 8px;font-size:11px;font-weight:bold;border-radius:2px;border:1px solid #2ecc7155">'+(label?label+"<br>":"")+esc(name)+'</div>';
  };

  const pickPlace = (name,lat,lng,zoom)=>{
    const map = mapInstanceRef.current;
    if(map&&!isNaN(lat)&&!isNaN(lng)){
      map.setView([lat,lng],zoom||10);
      if(markerRef.current) markerRef.current.remove();
      markerRef.current = L.circleMarker([lat,lng],{radius:9,color:"#c9a84c",weight:3,fillColor:"#c9a84c",fillOpacity:0.35}).addTo(map);
    }
    setLocPick({district:name});
  };

  const search = async ()=>{
    const term=q.trim(); if(term.length<2) return;
    setSearching(true); setSearchErr(""); setResults([]);
    try{
      const cc = ao.country ? "&countrycodes="+encodeURIComponent(ao.country.toLowerCase()) : "";
      const res = await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6"+cc+"&q="+encodeURIComponent(term));
      if(!res.ok) throw new Error("search service busy");
      const data = await res.json();
      if(!data.length) setSearchErr("NOTHING FOUND");
      setResults(data.map(d=>({...d,short:String(d.name||d.display_name.split(",")[0]).toUpperCase().slice(0,40)})));
    }catch(e){ setSearchErr("SEARCH FAILED — TRY AGAIN IN A MOMENT"); }
    setSearching(false);
  };
  const chooseResult = r => {
    const lat=parseFloat(r.lat), lng=parseFloat(r.lon);
    if(placingMRef.current){
      setMDraft(d=>({...d,lat:lat,lng:lng,name:d.name||r.short}));
      if(mapInstanceRef.current) mapInstanceRef.current.setView([lat,lng],12);
    } else if(placingRef.current){
      setDraft(d=>({...d,lat:lat,lng:lng,name:d.name||r.short}));
      if(mapInstanceRef.current) mapInstanceRef.current.setView([lat,lng],11);
    } else pickPlace(r.short,lat,lng,11);
    setResults([]);
  };

  const resetDistricts = ()=>districtLayersRef.current.forEach(({layer})=>layer.setStyle(DEF_STYLE));
  const selectDistrict = (name,layer,map)=>{
    resetDistricts();
    layer.setStyle(SEL_STYLE);
    layer.bringToFront();
    setSelected(name);
    setLocPick({district:name});
    if(map){ try{ map.fitBounds(layer.getBounds(),{padding:[40,40],maxZoom:14}); }catch(e){} }
  };
  const selectRegion = nm => {
    setSelected(nm);
    setLocPick({district:nm.toUpperCase().slice(0,40)});
    const layer = regionLayersRef.current[nm];
    if(layer&&mapInstanceRef.current){ try{ mapInstanceRef.current.fitBounds(layer.getBounds(),{padding:[40,40],maxZoom:12}); }catch(e){} }
  };
  selectRef.current = selectRegion;

  // ---- admin: mark the selected region / custom circle as off-limits or night-restricted ----
  const keyFor = nm => keyOf(level+"_"+nm);
  const curType = selected ? ((restrictions[keyFor(selected)]||{}).type||"none") : "none";
  const setRestriction = type => {
    if(!isAdmin||!selected) return;
    const key = keyFor(selected), old = curType;
    const p = type==="none" ? db.ref("restrictions/"+key).remove() : db.ref("restrictions/"+key).set({type:type,name:selected.slice(0,60),level:level});
    p.then(()=>{ auditNow("MAP",selected,"restriction",old,type); setAdminMsg({ok:true,t:selected.toUpperCase()+" → "+(type==="none"?"NO RESTRICTION":(type==="off"?"OFF LIMITS":"NIGHT RESTRICTED"))}); })
     .catch(()=>setAdminMsg({ok:false,t:"COULD NOT SAVE"}));
  };
  const saveCircle = () => {
    setAdminMsg(null);
    const nm = draft.name.trim().toUpperCase().slice(0,60), rad = parseFloat(draft.radius);
    if(!nm) return setAdminMsg({ok:false,t:"GIVE THE AREA A NAME"});
    if(draft.lat==null) return setAdminMsg({ok:false,t:"TAP THE MAP (OR CHOOSE A SEARCH RESULT) TO PLACE THE CENTRE"});
    if(!(rad>=0.1&&rad<=500)) return setAdminMsg({ok:false,t:"RADIUS MUST BE 0.1 – 500 KM"});
    const key = keyOf("c_"+nm).slice(0,30)+"_"+Date.now();
    db.ref("restrictions/"+key).set({type:draft.type,name:nm,level:"circle",lat:+draft.lat.toFixed(5),lng:+draft.lng.toFixed(5),radiusKm:rad})
      .then(()=>{ auditNow("MAP",nm,"restriction (circle)","none",draft.type+" r="+rad+"km"); setAdminMsg({ok:true,t:"AREA SAVED"}); setDraft({name:"",type:"off",radius:"2",lat:null,lng:null}); setPlacing(false); })
      .catch(()=>setAdminMsg({ok:false,t:"COULD NOT SAVE"}));
  };
  const removeRestriction = (key,r) => {
    if(!window.confirm("Remove "+r.name+" ("+(r.type==="off"?"off limits":"night restricted")+")?")) return;
    db.ref("restrictions/"+key).remove().then(()=>auditNow("MAP",r.name,"restriction",r.type,"none"));
  };
  const savePoly = () => {
    setAdminMsg(null);
    const nm=pDraft.name.trim().toUpperCase().slice(0,60);
    if(!nm) return setAdminMsg({ok:false,t:"GIVE THE AREA A NAME"});
    if(pDraft.pts.length<3) return setAdminMsg({ok:false,t:"TAP AT LEAST 3 CORNERS ON THE MAP"});
    const pts={}; pDraft.pts.forEach((q,i)=>{ pts[i]={lat:q[0],lng:q[1]}; });
    db.ref("restrictions/"+keyOf("p_"+nm).slice(0,30)+"_"+Date.now()).set({type:pDraft.type,name:nm,level:"poly",pts:pts})
      .then(()=>{ auditNow("MAP",nm,"restriction (shape)","none",pDraft.type+" "+pDraft.pts.length+" points"); setAdminMsg({ok:true,t:"AREA SAVED"}); setPDraft({name:"",type:pDraft.type,pts:[]}); setPlacingP(false); })
      .catch(()=>setAdminMsg({ok:false,t:"COULD NOT SAVE"}));
  };
  const saveMarker = () => {
    setAdminMsg(null);
    const nm=mDraft.name.trim().toUpperCase().slice(0,40);
    if(!nm) return setAdminMsg({ok:false,t:"GIVE THE MARKER A NAME"});
    if(mDraft.lat==null) return setAdminMsg({ok:false,t:"TAP THE MAP (OR CHOOSE A SEARCH RESULT) TO PLACE THE MARKER"});
    const o={name:nm,color:mDraft.color,lat:+mDraft.lat.toFixed(5),lng:+mDraft.lng.toFixed(5)};
    const note=mDraft.note.trim().slice(0,80); if(note) o.note=note;
    db.ref("markers/"+keyOf(nm+"_"+Date.now())).set(o)
      .then(()=>{ auditNow("MAP",nm,"marker","none","placed"); setAdminMsg({ok:true,t:"MARKER SAVED"}); setMDraft({name:"",note:"",color:mDraft.color,lat:null,lng:null}); setPlacingM(false); })
      .catch(()=>setAdminMsg({ok:false,t:"COULD NOT SAVE"}));
  };
  const removeMarker = (k,m) => { if(!window.confirm("Remove marker "+m.name+"?")) return; db.ref("markers/"+k).remove().then(()=>auditNow("MAP",m.name,"marker","placed","removed")); };
  const saveNight = () => {
    const v=nh.trim().slice(0,20); if(!v) return;
    db.ref("settings/nightHours").set(v).then(()=>{ auditNow("MAP","NIGHT HOURS","hours",nightHours,v); setAdminMsg({ok:true,t:"NIGHT HOURS SAVED"}); });
  };

  // ---- map creation (once) ----
  React.useEffect(()=>{
    if(!mapRef.current||mapInstanceRef.current) return;
    const map = L.map(mapRef.current,{
      center:[ao.lat||20,ao.lng||0],zoom:ao.zoom||(ao.lat?6:2),
      zoomControl:true,tap:true,touchZoom:true,dragging:true,
    });
    mapInstanceRef.current = map;

    // Base maps (all free, no key): OpenStreetMap (darkened or normal) and Esri satellite
    const OSMU='https://tile.openstreetmap.org/{z}/{x}/{y}.png';
    const baseLayers = {
      dark: L.tileLayer(OSMU,{maxZoom:19,className:'mt-dark-tiles',attribution:'© OpenStreetMap contributors'}),
      street: L.tileLayer(OSMU,{maxZoom:19,attribution:'© OpenStreetMap contributors'}),
      sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Imagery © Esri'})
    };
    baseLayersRef.current = baseLayers;
    Object.keys(baseLayers).forEach(k=>{
      let ok=0,bad=0; const L2=baseLayers[k];
      L2.on('tileload',()=>{ ok++; setTileNote(""); });
      L2.on('tileerror',()=>{ bad++; if(ok===0&&bad>=4) setTileNote("MAP PICTURE TILES ARE BLOCKED ON THIS NETWORK — REGION BORDERS AND LOCATIONS STILL WORK"); });
    });
    baseLayers.dark.addTo(map);

    map.on('click',e=>{ if(placingRef.current) setDraft(d=>({...d,lat:e.latlng.lat,lng:e.latlng.lng})); else if(placingMRef.current) setMDraft(d=>({...d,lat:e.latlng.lat,lng:e.latlng.lng})); else if(placingPRef.current) setPDraft(d=>d.pts.length>=50?d:({...d,pts:[...d.pts,[+e.latlng.lat.toFixed(5),+e.latlng.lng.toFixed(5)]]})); });

    // Optional KML overlay (map.kml). Layer type is read from the style colour used in the KML.
    const getLayerType = (feature)=>{
      const s = (feature.properties&&feature.properties.styleUrl)||"";
      if(s.includes("DB4436")) return "offlimits";
      if(s.includes("F4EB37")||s.includes("FFFF00")) return "night";
      if(s.includes("00FFFF")||s.includes("93D7E8")) return "district";
      return "other";
    };
    omnivore.kml('./map.kml', null, L.geoJson(null,{
      pointToLayer: ()=>null,
      filter: feature=>{ const t = feature.geometry&&feature.geometry.type||""; return t==="Polygon"||t==="MultiPolygon"; },
      style: feature=>{ const type = getLayerType(feature); if(type==="offlimits") return OFF_STYLE; if(type==="night") return NIGHT_STYLE; return DEF_STYLE; },
      onEachFeature:(feature,layer)=>{
        const type = getLayerType(feature);
        const name = (feature.properties&&(feature.properties.name||feature.properties.Name))||"";
        if(!name) return;
        if(type==="offlimits"){ layer.setStyle(OFF_STYLE); layer.bindTooltip(tipHtml(name,"off"),{sticky:true,opacity:1}); offLayersRef.current.push(layer); return; }
        if(type==="night"){ layer.setStyle(NIGHT_STYLE); layer.bindTooltip(tipHtml(name,"night"),{sticky:true,opacity:1}); nightLayersRef.current.push(layer); return; }
        if(type==="district"){
          layer.setStyle(DEF_STYLE);
          layer.on('mouseover',()=>layer.setStyle(HOV_STYLE));
          layer.on('mouseout',()=>layer.setStyle(DEF_STYLE));
          layer.on('click',()=>selectDistrict(name,layer,map));
          districtLayersRef.current.push({name,layer});
        }
      }
    }))
    .on('ready',function(){
      offLayersRef.current.forEach(l=>l.addTo(map));
      nightLayersRef.current.forEach(l=>l.addTo(map));
      const nm=[...new Set(districtLayersRef.current.map(l=>l.name))].sort();
      setDistricts(nm);
      setStatus("ready");
      if(nm.length||offLayersRef.current.length||nightLayersRef.current.length){ try{ map.fitBounds(this.getBounds(),{padding:[10,10]}); }catch(e){} }
    })
    .on('error',()=>setStatus("error"))
    .addTo(map);

    return()=>{ if(mapInstanceRef.current){mapInstanceRef.current.remove();mapInstanceRef.current=null;districtLayersRef.current=[];offLayersRef.current=[];nightLayersRef.current=[];regionLayerRef.current=null;regionLayersRef.current={};circleLayersRef.current=[];} };
  },[]);

  React.useEffect(()=>{
    const map=mapInstanceRef.current, bl=baseLayersRef.current; if(!map||!bl.dark) return;
    Object.keys(bl).forEach(k=>{ if(k!==base&&map.hasLayer(bl[k])) map.removeLayer(bl[k]); });
    if(!map.hasLayer(bl[base])){ bl[base].addTo(map); bl[base].bringToBack(); }
  },[base]);

  // re-centre when the admin changes the AO
  React.useEffect(()=>{
    if(mapInstanceRef.current&&ao.lat!=null) mapInstanceRef.current.setView([ao.lat,ao.lng],ao.zoom||6);
  },[ao.country,ao.lat,ao.lng,ao.zoom]);

  // ---- real region borders for the chosen country (free: geoBoundaries via GitHub, no key) ----
  React.useEffect(()=>{
    const map = mapInstanceRef.current; if(!map) return;
    let dead=false;
    if(regionLayerRef.current){ try{ regionLayerRef.current.remove(); }catch(e){} regionLayerRef.current=null; }
    regionLayersRef.current={}; setNames([]); setSelected(null);
    if(!iso3){ setGeoState("idle"); return; }
    setGeoState("loading");
    fetchBoundaries(iso3,level).then(gj=>{
      if(dead||!mapInstanceRef.current) return;
      const group = L.geoJSON(gj,{
        style:()=>DEF_STYLE,
        onEachFeature:(feat,layer)=>{
          const nm = String((feat.properties&&(feat.properties.shapeName||feat.properties.name))||"").trim();
          if(!nm) return;
          regionLayersRef.current[nm]=layer;
          layer.bindTooltip(()=>{ const r=restrictionsRef.current[keyOf(levelRef.current+"_"+nm)]; return tipHtml(nm,r&&r.type); },{sticky:true,opacity:1});
          layer.on('mouseover',()=>{ if(!placingRef.current) layer.setStyle(HOV_STYLE); });
          layer.on('mouseout',()=>{ applyStylesRef.current(); });
          layer.on('click',()=>{ if(placingRef.current||placingMRef.current||placingPRef.current) return; selectRef.current(nm); });
        }
      }).addTo(map);
      group.bringToBack();
      regionLayerRef.current=group;
      setNames(Object.keys(regionLayersRef.current).sort());
      setGeoState("ok");
      applyStylesRef.current();
      try{ map.fitBounds(group.getBounds(),{padding:[20,20]}); }catch(e){}
    }).catch(()=>{ if(!dead) setGeoState(level==="ADM1"?"error":"none"); });
    return ()=>{ dead=true; };
  },[iso3,level]);

  // colour regions by restriction / selection
  const applyStylesRef = React.useRef(()=>{});
  const applyStyles = ()=>{
    Object.entries(regionLayersRef.current).forEach(([nm,layer])=>{
      const r = restrictions[keyOf(level+"_"+nm)];
      let st = DEF_STYLE;
      if(r&&r.type==="off"&&showOff) st=OFF_STYLE; else if(r&&r.type==="night"&&showNight) st=NIGHT_STYLE;
      if(selected===nm) st=SEL_STYLE;
      layer.setStyle(st);
    });
  };
  applyStylesRef.current = applyStyles;
  React.useEffect(()=>{ applyStyles(); },[restrictions,showOff,showNight,selected,geoState,level]);

  // admin-drawn circular areas
  React.useEffect(()=>{
    const map = mapInstanceRef.current; if(!map) return;
    circleLayersRef.current.forEach(l=>{ try{ l.remove(); }catch(e){} }); circleLayersRef.current=[];
    Object.entries(restrictions).forEach(([k,r])=>{
      if(!r) return;
      if(r.type==="off"&&!showOff) return; if(r.type==="night"&&!showNight) return;
      let c;
      if(r.level==="poly"&&r.pts){ const pts=Object.values(r.pts).map(q=>[q.lat,q.lng]); if(pts.length<3) return; c=L.polygon(pts,r.type==="off"?OFF_STYLE:NIGHT_STYLE).addTo(map); }
      else if(r.level==="circle"&&r.lat!=null){ c = L.circle([r.lat,r.lng],{radius:(r.radiusKm||1)*1000,...(r.type==="off"?OFF_STYLE:NIGHT_STYLE)}).addTo(map); }
      else return;
      c.bindTooltip(tipHtml(r.name,r.type),{sticky:true,opacity:1});
      circleLayersRef.current.push(c);
    });
  },[restrictions,showOff,showNight,nightHours]);

  // preview of the circle being placed
  React.useEffect(()=>{
    const map = mapInstanceRef.current; if(!map) return;
    if(previewRef.current){ try{ previewRef.current.remove(); }catch(e){} previewRef.current=null; }
    const rad=parseFloat(draft.radius);
    if(draft.lat!=null&&rad>0) previewRef.current = L.circle([draft.lat,draft.lng],{radius:rad*1000,color:"#fff",weight:2,dashArray:"6 4",fillColor:draft.type==="off"?"#e74c3c":"#f39c12",fillOpacity:0.25}).addTo(map);
  },[draft.lat,draft.lng,draft.radius,draft.type]);

  React.useEffect(()=>{
    const map=mapInstanceRef.current; if(!map) return;
    if(previewPRef.current){ try{ previewPRef.current.remove(); }catch(e){} previewPRef.current=null; }
    const g=L.layerGroup(); const col=pDraft.type==="off"?"#e74c3c":"#f39c12";
    if(pDraft.pts.length>=3) L.polygon(pDraft.pts,{color:"#fff",weight:2,dashArray:"6 4",fillColor:col,fillOpacity:0.25}).addTo(g);
    else if(pDraft.pts.length===2) L.polyline(pDraft.pts,{color:"#fff",weight:2,dashArray:"6 4"}).addTo(g);
    pDraft.pts.forEach(q=>L.circleMarker(q,{radius:5,color:"#fff",weight:2,fillColor:col,fillOpacity:1}).addTo(g));
    g.addTo(map); previewPRef.current=g;
  },[pDraft.pts,pDraft.type]);

  // admin markers (everyone sees them)
  React.useEffect(()=>{
    const map=mapInstanceRef.current; if(!map) return;
    mkLayersRef.current.forEach(l=>{ try{ l.remove(); }catch(e){} }); mkLayersRef.current=[];
    if(!showMk) return;
    Object.values(markers||{}).forEach(m=>{
      if(!m||m.lat==null) return;
      const c=/^#[0-9a-fA-F]{6}$/.test(m.color||"")?m.color:"#3498db";
      const icon=L.divIcon({className:"",iconSize:[22,30],iconAnchor:[11,30],html:'<div style="width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:'+c+';border:2px solid #fff;box-shadow:0 0 4px #000;margin-top:2px"></div>'});
      const mk=L.marker([m.lat,m.lng],{icon:icon}).addTo(map);
      const esc=s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
      mk.bindTooltip('<div style="font-family:Share Tech Mono,monospace;font-size:11px;font-weight:bold;color:#fff;background:#0f1318;padding:4px 8px;border:1px solid '+c+'">'+esc(m.name)+(m.note?'<br><span style="font-weight:normal;color:#8a9aaa">'+esc(m.note)+'</span>':'')+'</div>',{direction:"top",offset:[0,-26],opacity:1});
      mkLayersRef.current.push(mk);
    });
  },[markers,showMk]);
  React.useEffect(()=>{
    const map=mapInstanceRef.current; if(!map) return;
    if(previewMRef.current){ try{ previewMRef.current.remove(); }catch(e){} previewMRef.current=null; }
    if(mDraft.lat!=null) previewMRef.current=L.circleMarker([mDraft.lat,mDraft.lng],{radius:10,color:"#fff",weight:2,dashArray:"4 3",fillColor:mDraft.color,fillOpacity:0.6}).addTo(map);
  },[mDraft.lat,mDraft.lng,mDraft.color]);

  // KML toggles
  React.useEffect(()=>{
    if(!mapInstanceRef.current) return;
    offLayersRef.current.forEach(l=>{ try{ showOff?l.addTo(mapInstanceRef.current):l.remove(); }catch(e){} });
  },[showOff]);
  React.useEffect(()=>{
    if(!mapInstanceRef.current) return;
    nightLayersRef.current.forEach(l=>{ try{ showNight?l.addTo(mapInstanceRef.current):l.remove(); }catch(e){} });
  },[showNight]);

  const toggleBtn = (active,onClick,color,label)=>(
    <button onClick={onClick} style={{background:active?color+"22":"#0f1318",border:"1px solid "+(active?color:"#1e2630"),color:active?color:"#5a6a7a",fontFamily:fnt,fontSize:"10px",letterSpacing:"1px",padding:"6px 12px",cursor:"pointer"}}>
      {label}
    </button>
  );
  const chipSt = (sel)=>({background:sel?"rgba(201,168,76,0.2)":"#0f1318",border:"1px solid "+(sel?"#c9a84c":"#2ecc7133"),color:sel?"#c9a84c":"#d4dde8",fontFamily:fnt,fontSize:"11px",letterSpacing:"1px",padding:"5px 10px",cursor:"pointer"});
  const inSt = {background:"#080a0d",border:"1px solid #1e2630",color:"#fff",fontFamily:fnt,fontSize:"12px",padding:"7px 10px",outline:"none",letterSpacing:"1px"};
  const smBtn = (c)=>({background:c+"1a",border:"1px solid "+c,color:c,fontFamily:fnt,fontSize:"10px",letterSpacing:"2px",padding:"7px 12px",cursor:"pointer"});
  const restList = Object.entries(restrictions).filter(([k,r])=>r&&r.type).sort((a,b)=>String(a[1].name).localeCompare(String(b[1].name)));

  return (
    <div>
      <div style={{marginBottom:"10px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"8px"}}>
        <div style={{fontSize:"11px",color:"#5a6a7a",letterSpacing:"1px",fontFamily:fnt}}>AO MAP — {ao.name?ao.name.toUpperCase():"TBC LOCATION"}</div>
        <div style={{fontFamily:fnt,fontSize:"10px",letterSpacing:"1px"}}>
          {!iso3&&<span style={{color:"#5a6a7a"}}>NO COUNTRY SET — ADMIN CHOOSES ONE IN THE ADMIN TAB</span>}
          {iso3&&geoState==="loading"&&<span style={{color:"#c9a84c"}}>⟳ LOADING REGION BORDERS...</span>}
          {iso3&&geoState==="ok"&&<span style={{color:"#2ecc71"}}>✓ {names.length} {level==="ADM1"?"REGIONS":"SUB-REGIONS"} LOADED</span>}
          {iso3&&geoState==="none"&&<span style={{color:"#e67e22"}}>NO SUB-REGION DATA FOR THIS COUNTRY</span>}
          {iso3&&geoState==="error"&&<span style={{color:"#e74c3c"}}>⚠ COULD NOT LOAD REGION BORDERS (NETWORK?) — REGION BUTTONS STILL WORK</span>}
        </div>
      </div>
      {tileNote&&<div style={{marginBottom:"8px",padding:"7px 12px",border:"1px solid #e67e22",background:"rgba(230,126,34,0.1)",color:"#e67e22",fontFamily:fnt,fontSize:"10px",letterSpacing:"1px"}}>⚠ {tileNote}</div>}

      {/* Layer toggles */}
      <div style={{display:"flex",gap:"8px",marginBottom:"10px",flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:"9px",color:"#5a6a7a",letterSpacing:"2px",fontFamily:fnt}}>SHOW:</span>
        {toggleBtn(showOff,()=>setShowOff(v=>!v),"#e74c3c","🔴 OFF LIMITS")}
        {toggleBtn(showNight,()=>setShowNight(v=>!v),"#f39c12","🟡 NIGHT RESTRICTION")}
        {toggleBtn(showMk,()=>setShowMk(v=>!v),"#3498db","📍 MARKERS")}
        <span style={{fontSize:"9px",color:"#5a6a7a",letterSpacing:"2px",fontFamily:fnt,marginLeft:"10px"}}>MAP:</span>
        {toggleBtn(base==="dark",()=>setBase("dark"),"#c9a84c","DARK")}
        {toggleBtn(base==="street",()=>setBase("street"),"#c9a84c","STREET")}
        {toggleBtn(base==="sat",()=>setBase("sat"),"#c9a84c","SATELLITE")}
        {iso3&&<>
          <span style={{fontSize:"9px",color:"#5a6a7a",letterSpacing:"2px",fontFamily:fnt,marginLeft:"10px"}}>DETAIL:</span>
          {toggleBtn(level==="ADM1",()=>setLevel("ADM1"),"#2ecc71","REGIONS")}
          {toggleBtn(level==="ADM2",()=>setLevel("ADM2"),"#2ecc71","SUB-REGIONS (MORE DETAIL)")}
        </>}
      </div>
      <div style={{display:"flex",gap:"16px",marginBottom:"10px",flexWrap:"wrap"}}>
        {[["#2ecc71","Region borders (tap to select)"],["#e74c3c","Off-limits — avoid"],["#f39c12","Night restriction "+nightHours]].map(([c,l])=>(
          <div key={l} style={{display:"flex",alignItems:"center",gap:"6px"}}>
            <div style={{width:"12px",height:"12px",background:c+"44",border:"2px solid "+c,flexShrink:0}}/>
            <span style={{fontSize:"10px",color:"#8a9aaa",fontFamily:fnt,letterSpacing:"1px"}}>{l}</span>
          </div>
        ))}
      </div>

      {/* Selected place -> restrict (admin) / set location */}
      {locPick&&(
        <div style={{background:"rgba(201,168,76,0.08)",border:"1px solid #c9a84c",padding:"12px 16px",marginBottom:"10px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}}>
            <div style={{color:"#c9a84c",fontFamily:"'Barlow Condensed',sans-serif",fontWeight:"900",fontSize:"20px",letterSpacing:"3px"}}>{locPick.district}
              {selected&&curType==="off"&&<span style={{marginLeft:"10px",fontSize:"11px",color:"#e74c3c",fontFamily:fnt,letterSpacing:"2px"}}>🔴 OFF LIMITS</span>}
              {selected&&curType==="night"&&<span style={{marginLeft:"10px",fontSize:"11px",color:"#f39c12",fontFamily:fnt,letterSpacing:"2px"}}>🟡 NIGHT RESTRICTED {nightHours}</span>}
            </div>
            <button onClick={()=>{resetDistricts();setSelected(null);setLocPick(null);}} style={{background:"transparent",border:"none",color:"#5a6a7a",cursor:"pointer",fontSize:"18px"}}>✕</button>
          </div>
          <div style={{fontSize:"10px",color:"#5a6a7a",letterSpacing:"2px",marginBottom:"8px",fontFamily:fnt}}>SET AS LOCATION FOR:</div>
          <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
            {myRow&&<button onClick={()=>{setPersonLocation(myUid,locPick.district);setLocPick(null);}}
              style={{background:"rgba(46,204,113,0.12)",border:"1px solid #2ecc71",color:"#2ecc71",fontFamily:fnt,fontSize:"11px",letterSpacing:"2px",padding:"7px 14px",cursor:"pointer"}}>ME — {myRow.name}</button>}
            {canEditOthers&&<select defaultValue=""
              onChange={e=>{ if(!e.target.value) return; setPersonLocation(e.target.value,locPick.district); e.target.value=""; }}
              style={{appearance:"none",WebkitAppearance:"none",background:"#080a0d",border:"1px solid #c9a84c55",color:"#fff",fontFamily:fnt,fontSize:"11px",padding:"7px 12px",cursor:"pointer",outline:"none",minWidth:"160px",borderRadius:"0"}}>
              <option value="">— SOMEONE ELSE —</option>
              {rows.map(r=><option key={r.uid} value={r.uid}>{r.rank} {r.name}</option>)}
            </select>}
            {!myRow&&!canEditOthers&&<div style={{fontSize:"10px",color:"#5a6a7a",fontFamily:fnt,letterSpacing:"1px"}}>You are not on the board, so there is no line to update.</div>}
          </div>
          <div style={{fontSize:"10px",color:"#5a6a7a",fontFamily:fnt,letterSpacing:"1px",marginTop:"8px"}}>→ updates the Location column on the board</div>
          {isAdmin&&selected&&regionLayersRef.current[selected]&&<div style={{marginTop:"14px",paddingTop:"12px",borderTop:"1px solid #c9a84c44"}}>
            <div style={{fontSize:"10px",color:"#c9a84c",letterSpacing:"2px",marginBottom:"8px",fontFamily:fnt}}>ADMIN — MARK THIS REGION:</div>
            <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
              <button style={smBtn("#e74c3c")} onClick={()=>setRestriction("off")}>🔴 OFF LIMITS</button>
              <button style={smBtn("#f39c12")} onClick={()=>setRestriction("night")}>🟡 NIGHT RESTRICTED</button>
              <button style={smBtn("#5a6a7a")} onClick={()=>setRestriction("none")}>CLEAR</button>
            </div>
          </div>}
        </div>
      )}

      <div ref={mapRef} style={{height:"520px",border:"1px solid #1e2630",width:"100%",touchAction:"manipulation",background:"#0b1118",cursor:(placing||placingM||placingP)?"crosshair":""}}/>

      {/* Search + regions */}
      <div style={{display:"flex",gap:"8px",margin:"12px 0 10px",flexWrap:"wrap"}}>
        <input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&search()} placeholder={"SEARCH A PLACE"+(ao.name?" IN "+ao.name.toUpperCase():"")+"..."} maxLength={60}
          style={{...inSt,flex:"1 1 220px"}}/>
        <button onClick={search} style={{background:"rgba(201,168,76,0.1)",border:"1px solid #c9a84c",color:"#c9a84c",fontFamily:fnt,fontSize:"11px",letterSpacing:"2px",padding:"8px 14px",cursor:"pointer"}}>{searching?"...":"SEARCH"}</button>
      </div>
      {searchErr&&<div style={{color:"#e74c3c",fontFamily:fnt,fontSize:"10px",letterSpacing:"1px",marginBottom:"8px"}}>⚠ {searchErr}</div>}
      {results.length>0&&<div style={{marginBottom:"10px",display:"flex",flexDirection:"column",gap:"4px"}}>
        {results.map((r,i)=>(
          <button key={i} onClick={()=>chooseResult(r)}
            style={{textAlign:"left",background:"#0f1318",border:"1px solid #1e2630",color:"#d4dde8",fontFamily:fnt,fontSize:"11px",letterSpacing:"0.5px",padding:"6px 10px",cursor:"pointer"}}>{r.display_name}</button>
        ))}
      </div>}

      {(names.length>0||regionList.length>0)&&(
        <div style={{marginBottom:"12px"}}>
          <div style={{fontSize:"10px",color:"#c9a84c",letterSpacing:"3px",marginBottom:"6px",fontFamily:fnt}}>{names.length>0?(level==="ADM1"?"REGIONS":"SUB-REGIONS")+" — TAP TO ZOOM IN & SET LOCATION":"REGIONS — TAP TO ZOOM IN & SET LOCATION"}</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:"6px",maxHeight:"170px",overflowY:"auto"}}>
            {names.length>0
              ? names.map(nm=>{ const r=restrictions[keyFor(nm)]; return <button key={nm} onClick={()=>selectRegion(nm)} style={{...chipSt(selected===nm),borderColor:selected===nm?"#c9a84c":(r&&r.type==="off"?"#e74c3c":(r&&r.type==="night"?"#f39c12":"#2ecc7133"))}}>{r&&r.type==="off"?"🔴 ":(r&&r.type==="night"?"🟡 ":"")}{nm}</button>; })
              : regionList.map(rg=>(
                <button key={rg[0]} onClick={()=>pickPlace(rg[0].toUpperCase().slice(0,40),rg[1],rg[2],9)} style={chipSt(locPick&&locPick.district===rg[0].toUpperCase().slice(0,40))}>{rg[0]}</button>
              ))}
          </div>
        </div>
      )}

      {districts.length>0&&(
        <div style={{marginBottom:"12px"}}>
          <div style={{fontSize:"10px",color:"#c9a84c",letterSpacing:"3px",marginBottom:"8px",fontFamily:fnt}}>KML DISTRICTS — TAP TO SELECT & SET LOCATION</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:"6px"}}>
            {districts.map(name=>(
              <button key={name}
                onClick={()=>{ const found=districtLayersRef.current.find(l=>l.name===name); if(found&&mapInstanceRef.current) selectDistrict(name,found.layer,mapInstanceRef.current); }}
                style={chipSt(selected===name)}>{name}</button>
            ))}
          </div>
        </div>
      )}

      {/* ADMIN: custom areas, list of restrictions, night hours */}
      {isAdmin&&(
        <div style={{marginTop:"16px",background:"#0d1117",border:"1px solid #1e2630",padding:"14px 16px"}}>
          <div style={{fontSize:"11px",color:"#c9a84c",letterSpacing:"3px",marginBottom:"4px",fontFamily:fnt}}>ADMIN — OFF-LIMITS & NIGHT-RESTRICTED AREAS</div>
          <div style={{fontSize:"10px",color:"#5a6a7a",letterSpacing:"1px",marginBottom:"12px",lineHeight:"1.6",fontFamily:fnt}}>Whole regions: tap a region on the map (or its button) and use the red / yellow buttons. Smaller areas: draw a circle below. Everyone sees the result.</div>

          <div style={{fontSize:"10px",color:"#5a6a7a",letterSpacing:"2px",marginBottom:"6px",fontFamily:fnt}}>NIGHT RESTRICTION HOURS</div>
          <div style={{display:"flex",gap:"8px",marginBottom:"16px",flexWrap:"wrap"}}>
            <input value={nh} onChange={e=>setNh(e.target.value)} maxLength={20} style={{...inSt,width:"160px"}}/>
            <button style={smBtn("#c9a84c")} onClick={saveNight}>SAVE HOURS</button>
          </div>

          <div style={{fontSize:"10px",color:"#5a6a7a",letterSpacing:"2px",marginBottom:"6px",fontFamily:fnt}}>DRAW A CIRCULAR AREA</div>
          <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center",marginBottom:"8px"}}>
            <input value={draft.name} onChange={e=>setDraft(d=>({...d,name:e.target.value}))} maxLength={40} placeholder="AREA NAME" style={{...inSt,flex:"1 1 160px"}}/>
            <select value={draft.type} onChange={e=>setDraft(d=>({...d,type:e.target.value}))} style={{...inSt,appearance:"none",WebkitAppearance:"none",cursor:"pointer"}}>
              <option value="off">🔴 OFF LIMITS</option><option value="night">🟡 NIGHT RESTRICTED</option>
            </select>
            <input type="number" min="0.1" max="500" step="0.5" value={draft.radius} onChange={e=>setDraft(d=>({...d,radius:e.target.value}))} style={{...inSt,width:"90px"}}/>
            <span style={{fontSize:"10px",color:"#5a6a7a",fontFamily:fnt}}>KM RADIUS</span>
          </div>
          <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>
            <button style={smBtn(placing?"#2ecc71":"#3498db")} onClick={()=>{ setPlacing(p=>!p); setPlacingM(false); setPlacingP(false); }}>{placing?"✔ TAP THE MAP NOW — CLICK TO STOP":"📍 PLACE CENTRE ON MAP"}</button>
            <button style={smBtn("#c9a84c")} onClick={saveCircle}>SAVE AREA</button>
            {draft.lat!=null&&<span style={{fontSize:"10px",color:"#8a9aaa",fontFamily:fnt}}>CENTRE {draft.lat.toFixed(4)}, {draft.lng.toFixed(4)}</span>}
          </div>
          <div style={{fontSize:"10px",color:"#5a6a7a",letterSpacing:"1px",marginTop:"6px",fontFamily:fnt}}>Tip: while placing, a place-search result also sets the centre.</div>
          {adminMsg&&<div style={{marginTop:"10px",fontSize:"11px",letterSpacing:"1px",fontFamily:fnt,color:adminMsg.ok?"#2ecc71":"#e74c3c"}}>{adminMsg.ok?"✔ ":"⚠ "}{adminMsg.t}</div>}

          <div style={{fontSize:"10px",color:"#5a6a7a",letterSpacing:"2px",margin:"18px 0 6px",fontFamily:fnt}}>DRAW A CUSTOM SHAPE (TAP EACH CORNER ON THE MAP)</div>
          <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center",marginBottom:"8px"}}>
            <input value={pDraft.name} onChange={e=>setPDraft(d=>({...d,name:e.target.value}))} maxLength={40} placeholder="AREA NAME" style={{...inSt,flex:"1 1 160px"}}/>
            <select value={pDraft.type} onChange={e=>setPDraft(d=>({...d,type:e.target.value}))} style={{...inSt,appearance:"none",WebkitAppearance:"none",cursor:"pointer"}}>
              <option value="off">🔴 OFF LIMITS</option><option value="night">🟡 NIGHT RESTRICTED</option>
            </select>
          </div>
          <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>
            <button style={smBtn(placingP?"#2ecc71":"#3498db")} onClick={()=>{ setPlacingP(p=>!p); setPlacing(false); setPlacingM(false); }}>{placingP?"✔ TAPPING CORNERS — CLICK TO STOP":"✏ DRAW SHAPE ON MAP"}</button>
            <button style={smBtn("#5a6a7a")} onClick={()=>setPDraft(d=>({...d,pts:d.pts.slice(0,-1)}))}>UNDO CORNER</button>
            <button style={smBtn("#5a6a7a")} onClick={()=>setPDraft(d=>({...d,pts:[]}))}>CLEAR</button>
            <button style={smBtn("#c9a84c")} onClick={savePoly}>SAVE SHAPE</button>
            <span style={{fontSize:"10px",color:"#8a9aaa",fontFamily:fnt}}>{pDraft.pts.length} CORNER{pDraft.pts.length===1?"":"S"} (3–50)</span>
          </div>
          <div style={{fontSize:"10px",color:"#5a6a7a",letterSpacing:"1px",marginTop:"6px",fontFamily:fnt}}>You can add as many areas as you need — each one is saved separately and can be removed from the list below.</div>

          <div style={{fontSize:"10px",color:"#5a6a7a",letterSpacing:"2px",margin:"18px 0 6px",fontFamily:fnt}}>PLACE A MARKER (EVERYONE SEES IT)</div>
          <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center",marginBottom:"8px"}}>
            <input value={mDraft.name} onChange={e=>setMDraft(d=>({...d,name:e.target.value}))} maxLength={40} placeholder="MARKER NAME" style={{...inSt,flex:"1 1 150px"}}/>
            <input value={mDraft.note} onChange={e=>setMDraft(d=>({...d,note:e.target.value}))} maxLength={80} placeholder="NOTE (OPTIONAL)" style={{...inSt,flex:"2 1 200px"}}/>
            <select value={mDraft.color} onChange={e=>setMDraft(d=>({...d,color:e.target.value}))} style={{...inSt,appearance:"none",WebkitAppearance:"none",cursor:"pointer",color:mDraft.color}}>
              {[["#3498db","BLUE"],["#2ecc71","GREEN"],["#e74c3c","RED"],["#f1c40f","YELLOW"],["#e67e22","ORANGE"],["#9b59b6","PURPLE"],["#ffffff","WHITE"]].map(([c,n])=><option key={c} value={c} style={{color:c}}>{n}</option>)}
            </select>
          </div>
          <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>
            <button style={smBtn(placingM?"#2ecc71":"#3498db")} onClick={()=>{ setPlacingM(p=>!p); setPlacing(false); setPlacingP(false); }}>{placingM?"✔ TAP THE MAP NOW — CLICK TO STOP":"📍 PLACE MARKER ON MAP"}</button>
            <button style={smBtn("#c9a84c")} onClick={saveMarker}>SAVE MARKER</button>
            {mDraft.lat!=null&&<span style={{fontSize:"10px",color:"#8a9aaa",fontFamily:fnt}}>AT {mDraft.lat.toFixed(4)}, {mDraft.lng.toFixed(4)}</span>}
          </div>
          <div style={{fontSize:"10px",color:"#5a6a7a",letterSpacing:"2px",margin:"18px 0 6px",fontFamily:fnt}}>CURRENT MARKERS ({Object.keys(markers||{}).length})</div>
          {Object.entries(markers||{}).map(([k,m])=>(
            <div key={k} style={{display:"flex",alignItems:"center",gap:"10px",padding:"5px 0",borderBottom:"1px solid #1e263088",fontFamily:fnt,fontSize:"11px",letterSpacing:"1px",flexWrap:"wrap"}}>
              <span style={{color:m.color}}>📍</span><span style={{color:"#fff",flex:"1 1 140px"}}>{m.name}</span><span style={{color:"#5a6a7a",flex:"2 1 160px"}}>{m.note||""}</span>
              <button style={{...smBtn("#3498db"),padding:"3px 8px"}} onClick={()=>mapInstanceRef.current&&mapInstanceRef.current.setView([m.lat,m.lng],13)}>GO TO</button>
              <button style={{...smBtn("#e74c3c"),padding:"3px 8px"}} onClick={()=>removeMarker(k,m)}>REMOVE</button>
            </div>
          ))}
          <div style={{fontSize:"10px",color:"#5a6a7a",letterSpacing:"2px",margin:"18px 0 6px",fontFamily:fnt}}>CURRENT RESTRICTIONS ({restList.length})</div>
          {restList.length===0&&<div style={{fontSize:"11px",color:"#5a6a7a",fontFamily:fnt}}>None set.</div>}
          {restList.map(([k,r])=>(
            <div key={k} style={{display:"flex",alignItems:"center",gap:"10px",padding:"5px 0",borderBottom:"1px solid #1e263088",fontFamily:fnt,fontSize:"11px",letterSpacing:"1px",flexWrap:"wrap"}}>
              <span style={{color:r.type==="off"?"#e74c3c":"#f39c12",minWidth:"120px"}}>{r.type==="off"?"🔴 OFF LIMITS":"🟡 NIGHT"}</span>
              <span style={{color:"#fff",flex:"1 1 160px"}}>{r.name}</span>
              <span style={{color:"#5a6a7a"}}>{r.level==="circle"?"CIRCLE "+r.radiusKm+" KM":(r.level==="poly"?"SHAPE":(r.level==="ADM2"?"SUB-REGION":"REGION"))}</span>
              <button style={{...smBtn("#e74c3c"),padding:"3px 8px"}} onClick={()=>removeRestriction(k,r)}>REMOVE</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function EvacCard({vi,evacData,writeEvac,vehList,nameList,f}){
  const vd = evacData["v"+vi]||{};
  const paxCount = parseInt(vd.paxCount)||0;

  const selV = (val)=>({appearance:"none",WebkitAppearance:"none",background:"#080a0d",border:"1px solid "+(val?"#c9a84c55":"#1e2630"),color:val?"#c9a84c":"#5a6a7a",fontFamily:f.mono,fontSize:"11px",padding:"5px 7px",cursor:"pointer",outline:"none",width:"100%",maxWidth:"320px",borderRadius:"0"});
  const selN = (val)=>({appearance:"none",WebkitAppearance:"none",background:"#080a0d",border:"1px solid "+(val?"#2ecc7155":"#1e2630"),color:val?"#2ecc71":"#5a6a7a",fontFamily:f.mono,fontSize:"11px",padding:"5px 7px",cursor:"pointer",outline:"none",width:"100%",maxWidth:"320px",borderRadius:"0"});
  const selP = (val)=>({appearance:"none",WebkitAppearance:"none",background:"#080a0d",border:"1px solid "+(val?"#3498db55":"#1e2630"),color:val?"#3498db":"#5a6a7a",fontFamily:f.mono,fontSize:"11px",padding:"5px 7px",cursor:"pointer",outline:"none",width:"80px",borderRadius:"0"});
  const lbl = {fontSize:"9px",color:"#5a6a7a",letterSpacing:"2px",minWidth:"65px",flexShrink:0,fontFamily:f.mono};
  const row = {display:"flex",gap:"8px",marginBottom:"10px",alignItems:"center",flexWrap:"wrap"};

  const handlePaxCount = (e)=>{
    const n=parseInt(e.target.value)||0;
    writeEvac(vi,"paxCount",String(n));
    for(let i=n+1;i<=12;i++) if(vd["pax"+i]) writeEvac(vi,"pax"+i,"");   // clear seats that no longer exist
  };

  const totalOnBoard = 1 + paxCount; // driver + pax

  return (
    <div style={{background:"#0f1318",border:"1px solid #1e2630",padding:"14px 16px",marginBottom:"12px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"1px solid #1e2630",paddingBottom:"10px",marginBottom:"12px",flexWrap:"wrap",gap:"8px"}}>
        <span style={{fontFamily:f.sans,fontWeight:"900",fontSize:"22px",color:"#c9a84c",letterSpacing:"3px"}}>VEH {String(vi+1).padStart(2,"0")}</span>
        {vd.vehicle&&<span style={{fontFamily:f.mono,fontSize:"11px",color:"#5a6a7a",letterSpacing:"1px"}}>{vd.vehicle}</span>}
        {totalOnBoard>1&&<span style={{background:"rgba(52,152,219,0.15)",border:"1px solid rgba(52,152,219,0.4)",color:"#3498db",fontFamily:f.mono,fontSize:"10px",padding:"3px 8px",letterSpacing:"1px"}}>{totalOnBoard} ON BOARD</span>}
      </div>

      <div style={row}>
        <span style={lbl}>VEHICLE</span>
        <select value={vd.vehicle||""} onChange={e=>writeEvac(vi,"vehicle",e.target.value)} style={selV(vd.vehicle)}>
          <option value="">— SELECT VEHICLE —</option>
          {vehList.map(v=><option key={v} value={v}>{v}</option>)}
          {vd.vehicle&&!vehList.includes(vd.vehicle)&&<option value={vd.vehicle}>{vd.vehicle}</option>}
        </select>
      </div>

      <div style={row}>
        <span style={lbl}>DRIVER</span>
        <select value={vd.driver||""} onChange={e=>writeEvac(vi,"driver",e.target.value)} style={selN(vd.driver)}>
          <option value="">— SELECT DRIVER —</option>
          {nameList.map(n=><option key={n} value={n}>{n}</option>)}
          {vd.driver&&!nameList.includes(vd.driver)&&<option value={vd.driver}>{vd.driver}</option>}
        </select>
      </div>

      <div style={row}>
        <span style={lbl}>PAX COUNT</span>
        <select value={String(paxCount)} onChange={handlePaxCount} style={selP(paxCount>0)}>
          <option value="0">0</option>
          {Array.from({length:12},(_,i)=>i+1).map(n=><option key={n} value={String(n)}>{n}</option>)}
        </select>
        <span style={{fontSize:"10px",color:"#5a6a7a",fontFamily:f.mono,letterSpacing:"1px"}}>PAX SEATS</span>
      </div>

      {paxCount>0&&<>
        <div style={{fontSize:"9px",color:"#5a6a7a",letterSpacing:"2px",marginBottom:"8px",fontFamily:f.mono}}>PAX ({paxCount})</div>
        <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
          {Array.from({length:paxCount},(_,si)=>(
            <select key={si+1} value={vd["pax"+(si+1)]||""} onChange={e=>writeEvac(vi,"pax"+(si+1),e.target.value)} style={{...selN(vd["pax"+(si+1)]),minWidth:"130px",flex:"1"}}>
              <option value="">— PAX {si+1} —</option>
              {nameList.map(n=><option key={n} value={n}>{n}</option>)}
              {vd["pax"+(si+1)]&&!nameList.includes(vd["pax"+(si+1)])&&<option value={vd["pax"+(si+1)]}>{vd["pax"+(si+1)]}</option>}
            </select>
          ))}
        </div>
      </>}
    </div>
  );
}

function EvacTab({evacData,writeEvac,setEvacCount,vehicles,rows,f,s}){
  const vehList=vehicles.filter(v=>v.vrn).map(v=>v.vrn+(v.make?" "+v.make:"")+(v.model?" "+v.model:""));
  const nameList=rows.filter(r=>r.name).map(r=>r.name);
  const meta = evacData.meta||{};
  const count = Math.max(1,Math.min(100,parseInt(meta.count)||10));
  const idx = Array.from({length:count},(_,i)=>i);
  const used = idx.filter(vi=>(evacData["v"+vi]||{}).vehicle);
  const totalOnBoard = used.reduce((a,vi)=>a+1+(parseInt((evacData["v"+vi]||{}).paxCount)||0),0);
  const stepBtn = {background:"#080a0d",border:"1px solid #c9a84c55",color:"#c9a84c",fontFamily:f.mono,fontSize:"16px",width:"34px",height:"34px",cursor:"pointer"};
  return <>
    <div style={{...s.hint,marginBottom:"10px"}}>EVAC VEHICLE PAX LIST — {count} VEHICLE{count===1?"":"S"}</div>
    <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"14px",flexWrap:"wrap"}}>
      <span style={{fontSize:"10px",color:"#5a6a7a",letterSpacing:"2px",fontFamily:f.mono}}>NUMBER OF VEHICLES</span>
      <button style={stepBtn} onClick={()=>setEvacCount(Math.max(1,count-1))}>−</button>
      <span style={{fontFamily:f.sans,fontWeight:"900",fontSize:"22px",color:"#fff",minWidth:"34px",textAlign:"center"}}>{count}</span>
      <button style={stepBtn} onClick={()=>setEvacCount(Math.min(100,count+1))}>+</button>
      <span style={{fontSize:"10px",color:"#5a6a7a",letterSpacing:"1px",fontFamily:f.mono}}>(1–100 · hidden vehicles keep their details)</span>
    </div>
    {totalOnBoard>0&&<div style={{background:"rgba(52,152,219,0.08)",border:"1px solid rgba(52,152,219,0.3)",padding:"8px 14px",marginBottom:"14px",fontSize:"11px",color:"#3498db",fontFamily:f.mono,letterSpacing:"1px"}}>
      TOTAL ON BOARD: {totalOnBoard} PERSONNEL ACROSS {used.length} VEHICLE{used.length===1?"":"S"}
    </div>}
    {idx.map(vi=>(
      <EvacCard key={vi} vi={vi} evacData={evacData} writeEvac={writeEvac} vehList={vehList} nameList={nameList} f={f}/>
    ))}
  </>;
}

function InstallBanner({onInstall,onDismiss,f}){
  return (
    <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#0d1117",borderTop:"2px solid #c9a84c",padding:"12px 20px",display:"flex",alignItems:"center",gap:"12px",zIndex:999,flexWrap:"wrap"}}>
      <div style={{flex:1,minWidth:"160px"}}>
        <div style={{color:"#c9a84c",fontSize:"11px",letterSpacing:"2px",marginBottom:"2px",fontFamily:f.mono}}>📲 INSTALL AS APP</div>
        <div style={{color:"#5a6a7a",fontSize:"10px",letterSpacing:"1px",fontFamily:f.mono}}>Add to home screen for quick access</div>
      </div>
      <button onClick={onInstall} style={{background:"rgba(201,168,76,0.15)",border:"1px solid #c9a84c",color:"#c9a84c",fontFamily:f.mono,fontSize:"11px",letterSpacing:"2px",padding:"8px 16px",cursor:"pointer",whiteSpace:"nowrap"}}>INSTALL</button>
      <button onClick={onDismiss} style={{background:"transparent",border:"none",color:"#5a6a7a",fontFamily:f.mono,fontSize:"16px",cursor:"pointer",padding:"4px 8px"}}>✕</button>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Root));
</script>
